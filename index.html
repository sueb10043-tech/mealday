<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>mealday</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mealday">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--text:#111;--sub:#8e8e93;--line:#efefef;--soft:#f6f5f2;--blue:#2f6fde;--red:#e5484d;--brown:#B88A5A;--mono:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.view{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 22px calc(150px + env(safe-area-inset-bottom))}
.top-actions{display:flex;justify-content:space-between;align-items:center;height:40px}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:700;font-size:30px;color:#a9a59d;letter-spacing:.2px;line-height:1}
.top-btns{display:flex;gap:4px}
.demo-tag{position:sticky;top:0;z-index:30;text-align:center;font-size:12px;color:#7a6a4f;background:#FBF2C6;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
.demo-tag button{margin-left:8px;padding:3px 10px;border-radius:999px;background:#111;color:#fff;font-size:12px;font-weight:600}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:20px}
.back-btn{display:inline-flex;align-items:center;gap:2px;height:40px;color:var(--sub);font-size:17px}
.icon-btn:active{background:var(--soft)}
h1.big{font-size:42px;font-weight:800;letter-spacing:-1.2px;margin:8px 0 6px}
.date-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 2px}
.date-title{font-size:21px;font-weight:800;letter-spacing:-.6px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.date-row{gap:6px}
.date-l{display:flex;align-items:center;gap:4px;min-width:0}
.day-score{flex:none;font-size:19px;line-height:1;padding:2px 0;border-radius:12px;letter-spacing:-1px}
.day-score.empty{width:32px;height:32px;padding:0;border:0;background:none;letter-spacing:0;display:block;line-height:0}
.day-score.empty svg{display:block}
.score-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.score-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 14px;border-radius:20px;background:#fff;border:2px solid transparent}
.score-btn span{font-size:38px;line-height:1}
.score-btn.drink{background:#FFF8EC}
.score-btn b{font-size:15px;color:#333}
.score-btn.on{border-color:#C2A27C;background:#FBF7F1}
.daynav{display:flex;gap:4px;flex:none}
.nav-btn{width:36px;height:36px;border-radius:18px;flex:none;background:var(--soft);font-size:22px;display:grid;place-items:center;text-align:center;color:#333;line-height:1}
.nav-btn:disabled{opacity:.3}
.water{display:flex;align-items:center;gap:6px;color:#222;font-size:16px;font-weight:700;white-space:nowrap;line-height:1;min-height:36px}
.water > span:last-child{font-weight:400;color:#555}
.sec-head .sec-add{margin-bottom:0}
.water b{color:var(--text);font-size:16px}
.water small{font-size:12px}
.w-btn{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;text-align:center;color:#333;font-size:17px;line-height:1}
.w-btn.plus{background:#DDEBFB;color:#2f6fde}
#todayBody{transition:opacity .15s}

.sync-mini{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.sync-btn{color:var(--text);font-weight:600;text-decoration:none;padding:6px 12px;background:var(--soft);border-radius:999px;white-space:nowrap;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);width:100%;background:var(--soft);border-radius:16px;padding:12px 0}
.m-cell{display:flex;flex-direction:column;align-items:center;gap:4px;border-right:1px solid #e6e3dc;min-width:0}
.m-cell:last-child{border-right:0}
.m-label{font-size:11px;color:var(--sub);white-space:nowrap}
.m-val{font-size:15px;font-weight:600;white-space:nowrap;letter-spacing:-.3px}
.m-val small{font-size:10px;color:var(--sub);margin-left:1px;font-weight:400;letter-spacing:0}
.act-line{display:flex;align-items:center;gap:8px;margin-top:12px}
.wk-list{margin-top:6px}
.wk{display:flex;align-items:center;gap:8px;width:100%;padding:7px 0;font-size:15px}
.wk-name{color:#222}
.wk-sub{color:var(--sub)}
.wk-auto{font-size:11px;color:#c0613c;background:#FDEDE7;border-radius:6px;padding:2px 6px}
.kcal-total{font-size:15px;color:#222;white-space:nowrap}
.wk-pick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.steps{font-size:15px;white-space:nowrap}
.state-chips{width:100%;padding:2px 0}
.head-acts{display:flex;align-items:center;gap:8px}
.x-btn{width:40px;height:40px;border-radius:50%;background:#e4e4e4;display:grid;place-items:center;font-size:16px;color:#555;text-align:center}

.sec{margin-top:26px}
.sec-add,.sec-head{display:flex;align-items:center;gap:6px;white-space:nowrap;color:#222;font-size:16px;font-weight:700;margin-bottom:4px;min-height:36px}
.sec-add span{font-weight:400;color:#555}
.sec-head{justify-content:space-between}
.sec-add span{font-size:20px;line-height:1}
.head-plus{font-size:28px;line-height:1;color:var(--text);width:36px;height:36px;display:grid;place-items:center;font-weight:300}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 0;border-bottom:1px solid var(--line);gap:12px}
.row .name{font-size:17px}
.row .val{font-size:20px;white-space:nowrap}
.state-row{justify-content:flex-start}
.time{color:var(--sub);font-size:14px;white-space:nowrap}
.dash{color:#c7c7cc}
.badge{font-size:11px;color:var(--sub);background:var(--soft);border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:9px 16px;border:1.5px solid #dcdcdc;border-radius:999px;font-size:16px;background:#fff}
.chip.sm{padding:4px 11px;font-size:14px;border-width:1px}
.chip .ct{font-size:12px;color:#8a7a66;margin-left:5px;font-weight:500}
.t-rows{margin:12px 0 0;padding:0 16px 14px;border-top:1px solid #eee}
.t-row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 0;font-size:15px}
.t-row input[type=time]{border:0;background:#ececec;border-radius:10px;padding:6px 8px;font-size:15px;min-height:34px;-webkit-appearance:none;appearance:none;width:120px}
.chip.on{background:#111;color:#fff;border-color:#111}
.chip.add{border-style:dashed;color:var(--sub)}
.chip.toilet{background:#F3ECE4;border-color:#F3ECE4}
.chip .x{color:var(--sub);margin-left:2px;font-size:18px;line-height:1;padding:0 2px}

.meal{display:flex;gap:16px;width:100%;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.thumb{width:180px;height:136px;border-radius:16px;overflow:hidden;background:var(--soft);flex:none;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
/* 사진이 여러 장이어도 같은 크기 칸 안에 나눠 넣기 */
.thumb.n2,.thumb.n3,.thumb.n4{gap:2px;place-items:stretch;background:#fff}
.thumb.n2{grid-template-columns:1fr 1fr}
.thumb.n3,.thumb.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.thumb.n3 .pc:first-child{grid-row:span 2}
.thumb .pc{position:relative;overflow:hidden;min-height:0;background:var(--soft)}
.thumb .more{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center}
.thumb-emoji{font-size:34px}
.pv{position:fixed;inset:0;z-index:60;background:#0b0b0b;touch-action:none;user-select:none;-webkit-user-select:none;animation:fade .15s}
.pv-x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:18px;display:grid;place-items:center}
.pv-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:calc(env(safe-area-inset-top) + 60px) 0 calc(env(safe-area-inset-bottom) + 30px)}
.pv-grid{display:grid;gap:4px;width:100%;max-height:100%;transform-origin:center center;will-change:transform}
.pv-grid img{width:100%;height:auto;display:block;border-radius:4px;pointer-events:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.meal-info{flex:1;min-width:0;padding-top:4px}
.meal-top{display:flex;align-items:center;gap:10px}
.lunch-pv{background:#FBF4EA;border-radius:16px;padding:12px 14px;margin:6px 0 4px}
.lunch-pv b{font-size:13px;color:#7a6a4f}
.lunch-pv p{margin:6px 0 0;font-size:14px;color:#333;line-height:1.5}
.lunch-pv .lp-empty{color:var(--sub)}
.meal .tag-pill{font-size:13px}
.meal .time{font-size:12px}
.meal .memo{font-size:13px}
.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-weight:700;font-size:15px;background:#eee;white-space:nowrap}
.tag-pill.big{padding:10px 20px;font-size:19px}
.memo{margin-top:8px;font-size:16px;color:#333;white-space:pre-wrap;word-break:break-all;line-height:1.45}
.empty{color:#b0b0b5;font-size:15px;padding:14px 0;margin:0}
.diary-text{display:block;width:100%;white-space:pre-wrap;line-height:1.6;color:#333;padding:6px 0}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;background:rgba(250,250,250,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.04);z-index:20}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 18px;white-space:nowrap;border-radius:999px;font-size:12px;color:#555}
.tabbar button.on{background:#e9e9e9;color:#111;font-weight:600}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;margin:0 auto;max-width:560px;background:#f2f2f2;border-radius:32px 32px 0 0;z-index:41;display:flex;flex-direction:column;animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:#c9c9c9;margin:10px auto 4px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px 22px}
.sheet-head h3{margin:0;font-size:20px;font-weight:700}
.pill-btn{height:40px;padding:0 18px;border-radius:999px;background:#e4e4e4;font-weight:500;display:inline-flex;align-items:center;justify-content:center;line-height:1}   /* ✕ 버튼(40px)과 같은 높이 */
.pill-btn.primary{background:#111;color:#fff;font-weight:600}
.pill-btn:disabled{background:#e4e4e4;color:#aaa}
.sheet-body{overflow-y:auto;padding:8px 16px 28px;-webkit-overflow-scrolling:touch}

.group{background:#fff;border-radius:20px;margin:10px 0;overflow:hidden}
.group.pad{padding:16px}
.group-label{color:var(--sub);font-size:14px;padding:16px 16px 10px}
.group > .chips{padding:0 16px 16px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;min-height:56px}
.field:last-child{border-bottom:0}
.field > span{white-space:nowrap;flex:none}
.dt{display:flex;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.dt input{min-width:0}
.dt input,.field input[type=time],select{border:0;background:#ececec;border-radius:10px;padding:8px 10px;font-size:16px;-webkit-appearance:none;appearance:none;min-height:38px}
.num{display:flex;align-items:center;gap:6px}
.num input{width:100px;text-align:right;border:0;background:#f1f1f1;border-radius:10px;padding:8px 10px;font-size:18px;font-family:var(--mono);outline:none}
.num em{font-style:normal;color:var(--sub);width:24px}
input.plain{border:0;background:transparent;outline:none;font-size:17px;min-width:0;flex:1;text-align:right}
.center{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.photo-box{display:grid;place-items:center;width:100%;aspect-ratio:1/1;background:#fff;border-radius:22px;margin:10px 0;overflow:hidden;position:relative}
.photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plus-big{font-size:56px;color:#d8d2c6;font-weight:200}
.photo-acts{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
.photo-acts button{font-size:14px;padding:7px 14px;background:#fff;border-radius:999px}
textarea{width:100%;border:0;border-radius:20px;padding:16px;background:#fff;font-size:16px;resize:none;outline:none;line-height:1.5;min-height:110px;display:block;margin-top:10px}
.del-btn{display:block;width:100%;margin-top:16px;padding:15px;border-radius:16px;background:#fff;color:var(--red);text-align:center;font-weight:600}
.add-row{display:flex;gap:8px;padding:0 16px 16px}
.group.pad .add-row{padding:14px 0 0}
.add-row input{flex:1;min-width:0;border:0;background:#f1f1f1;border-radius:12px;padding:10px 12px;outline:none}
.add-row button{padding:10px 16px;background:#111;color:#fff;border-radius:12px;font-weight:600}
.hint{color:var(--sub);font-size:13px;line-height:1.5;margin:6px 6px 0}

.set-label{color:#333;font-size:14px;font-weight:700;margin:26px 6px 0}
.view .group{background:var(--soft)}
.view .group .field{border-color:#e8e6e1}
.view .add-row input{background:#fff}
.link{color:var(--blue)}
.danger-text{color:var(--red)}
.sub{color:var(--sub);font-size:15px}
.seg{display:flex;background:#e8e6e1;border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:10px;text-align:center}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.palette{display:flex;gap:10px;flex-wrap:wrap;margin:10px 4px}
.order-row{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 16px;border-bottom:1px solid #e8e6e1;min-height:56px;background:var(--soft);position:relative}
.order-row .grow{flex:1;min-width:0;text-align:left;font-size:17px;padding:6px 0}
.drag{width:44px;height:40px;display:grid;place-items:center;color:#aaa;font-size:22px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.order-row.dragging{z-index:3;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:12px}
.order-row.dragging .drag{color:#333;cursor:grabbing}
.tag-pill.none{background:#ECEAE5;color:#8e8e93;font-weight:600}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:#111}

.month-nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px}
.cal-tabs{display:flex;justify-content:stretch;gap:0;border-bottom:1px solid #ebe9e4;margin:0 -22px 12px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.cal-tabs::-webkit-scrollbar{display:none}
.cal-tabs button{flex:1 1 0;min-width:0;padding:10px 4px 9px;text-align:center;font-size:15px;color:#9a9a9e;font-weight:600;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.cal-tabs button.on{color:#111;border-bottom-color:#B08D63}
.cal-tabs-div{flex:none;width:1px;background:#dcd8d0;margin:9px 2px}   /* 전체 | 나머지 구분선 */
.cal-sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.cal-sub button{padding:6px 12px;border-radius:999px;background:#F3F1EC;font-size:13px;color:#555;font-weight:600}
.cal-sub button.on{background:#111;color:#fff}
.cv{display:block;max-width:calc(100% - 3px);margin-top:2px;padding:3px 4px;border-radius:7px;font-size:11px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv.cvt{white-space:normal;word-break:break-all;overflow:visible;text-overflow:clip;font-size:10px;padding:3px;letter-spacing:-.3px}
.bv{display:flex;align-items:baseline;margin-top:1px;font-size:9.5px;font-weight:600;color:#5b4630;white-space:nowrap;letter-spacing:-.4px;line-height:1.4}
.bv i{flex:none;width:10px;font-style:normal;font-size:inherit;font-weight:700;color:#a58b6a;margin-right:2.5px;letter-spacing:0;text-align:left}
.bv.bx i{width:11px;margin-right:1.5px;font-size:9px}
.bv small{font-size:inherit;font-weight:500;color:#9a8a76;margin-left:.5px}
.bv.na{color:#c4bdb2}
.bv.tight{font-size:8.5px;letter-spacing:-.6px}   /* 10,000보 넘는 날처럼 긴 숫자만 살짝 작게 */
.cv.cvb{background:#F3EEE6;color:#7a5c38}
.cv.cve{background:#FDEFE6;color:#D9622B}
.cv.cvs{background:#E8F1FB;color:#2F6FE0}
.cv.cvt{background:#F1F1EF;color:#444;font-weight:500}
.cv.cvg{background:#E6F5FC;color:#2F7FA8}
.cv .cnt{font-size:10px;margin-left:1px;font-weight:700}
.cv.cvn{background:#EFEFEF;color:#666}
.cal-sum{text-align:center;font-size:15px;color:#333;padding:6px 8px}
.st-row{display:flex;justify-content:space-between;padding:8px 2px;font-size:15px;color:#333}
.st-row+.st-row{border-top:1px solid #e6e3dc}
.cal-key{display:flex;gap:12px;font-size:12px;color:var(--sub);margin:-4px 2px 10px}
.cal-key i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px;vertical-align:0}
.wk-table{width:100%;border-collapse:collapse;font-size:14px}
.wk-table th,.wk-table td{padding:7px 2px;text-align:right;white-space:nowrap}
.wk-table thead th{font-size:12px;color:var(--sub);font-weight:600}
.wk-table thead th small{font-weight:400;margin-left:1px}
.wk-table tbody th{text-align:left;font-weight:600;color:#555;font-size:13px}
.wk-table tbody tr+tr th,.wk-table tbody tr+tr td{border-top:1px solid #e6e3dc}
.wk-table td b{font-weight:700}
.wk-d{display:inline-block;width:38px;margin-left:3px;font-size:11px;color:var(--sub);text-align:left}
.wk-d.up{color:#2F6FE0}.wk-d.dn{color:#E5484D}
.wk-na{color:#bbb}
.month-nav span{font-size:20px;font-weight:700}
.month-nav button{width:40px;height:40px;font-size:24px;border-radius:20px;text-align:center}
.cal{margin:0 -18px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px}
.cal-body{grid-auto-rows:1fr}   /* 모든 칸 높이를 그 달에서 가장 큰 칸에 맞춰 똑같이 */
.wd{color:#555;font-weight:600;font-size:13px;text-align:center;padding-bottom:6px}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:2px 0 4px 4px;overflow:visible;min-width:0;border-radius:14px;min-height:66px;border:2px solid transparent}

<script>
const DEFAULT_SC = 'mealday 동기화';
const BRAND_FONT = '"Cormorant Garamond", Georgia, serif';
const PALETTE = ['#DFF3E0','#FBE8D0','#E6E1F7','#FBF2C6','#DDEBFB','#FBDDE3','#ECECEC'];
const WD = ['일','월','화','수','목','금','토'];

const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const has = v => v !== '' && v != null && !isNaN(+v);
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function nowTime(){ const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function parseYmd(s){ const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function addDays(s, n){ const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function korDate(s){ const d = parseYmd(s); return `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; }
function longDate(s){ const d = parseYmd(s); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; }
function korTime(t){ if(!t) return ''; const a = String(t).split(':').map(Number); const h = a[0], m = a[1] || 0; let hh = h % 12; if (hh === 0) hh = 12; return `${h < 12 ? '오전' : '오후'} ${hh}:${pad(m)}`; }
function fmtSync(s){ const d = s.slice(0,10), t = s.slice(11,16); return d === todayStr() ? korTime(t) : `${+d.slice(5,7)}/${+d.slice(8,10)} ${korTime(t)}`; }

const S = {
  settings: null, date: todayStr(), day: null, photos: {},
  ym: todayStr().slice(0,7), tab: 'today', lastSync: '', calTab: lsGet('md_caltab') || 'all', calBody: 'wt',
  exOpt: null, exUrl: ''
};

/* ───── 미리보기 모드 (Apps Script 밖에서 열었을 때 예시 데이터로 동작) ───── */
/* ───── 서버 연결 ─────
 * EXEC_URL: Apps Script 웹 앱 주소(…/exec).
 * GitHub 저장소가 '공개'라면 여기는 비워 두세요. 휴대폰에서 처음 한 번 주소를 붙여넣으면 그 기기에만 저장돼요.
 * (공개 저장소에 주소를 적으면 누구나 코드를 보고 내 기록에 접근할 수 있어요.)
 */
const EXEC_URL = '';
/* 화면 버전: 코드를 고칠 때마다 바뀌어요. 홈 화면 앱이 예전 화면을 붙잡고 있으면 이걸 보고 새 화면으로 바꿔요. */
const APP_VERSION = '2026-11-10-114';
const IN_GAS = !!(window.google && google.script && google.script.run);   // Apps Script 주소로 열었을 때
const EXEC = EXEC_URL || lsGet('md_exec') || '';
const DEMO = !IN_GAS && !EXEC;
const demoApi = (() => {
  if (!DEMO) return null;
  const tags = [
    { id:'breakfast', name:'아침', emoji:'⛅', color:'#DFF3E0' },
    { id:'lunch', name:'점심', emoji:'☀️', color:'#FBE8D0' },
    { id:'dinner', name:'저녁', emoji:'🌙', color:'#E6E1F7' },
    { id:'snack', name:'간식', emoji:'🥝', color:'#FBF2C6' }
  ];
  const db = {
    settings: { tags, weekStart:'mon', chips:['💩👍','💩👎','더부룩함','가스참'], shortcutName:'mealday 동기화' },
    meals: [], states: [], workouts: [], body: {}, activity: {}, diary: {}, photos: {}, lastSync: ''
  };
  let seq = 0; const nid = () => 'd' + (++seq) + Date.now().toString(36);
  const menus = [
    ['breakfast','07:40','우유, 오픈샌드위치(식빵 1/2), 복숭아'], ['breakfast','08:05','그릭요거트, 그래놀라 조금'],
    ['lunch','12:20','잡곡밥\n된장국\n닭볶음\n나물'], ['lunch','12:15','카레라이스\n샐러드\n깍두기'],
    ['snack','15:30','아메리카노, 쿠키 하나'], ['dinner','18:40','현미밥 반 공기, 연어구이, 쌈채소'],
    ['dinner','19:10','떡볶이 조금, 삶은 달걀'], ['snack','21:00','바나나']
  ];
  const today = todayStr(), first = today.slice(0,8) + '01';
  for (let i = 0; i < 14; i++) {
    const d = addDays(today, -i); if (d < first && i > 6) break;
    const n = 2 + (i % 3);
    for (let k = 0; k < n; k++) { const m = menus[(i * 3 + k * 2) % menus.length]; db.meals.push({ id:nid(), date:d, time:m[1], tag:m[0], memo:m[2], photoId:'' }); }
    db.body[d] = { date:d, weight:(55.8 + i * 0.07 + (i % 2 ? 0.2 : 0)).toFixed(1), bodyFat:(20.7 + i * 0.05).toFixed(1), bmi:(20.2 + i * 0.02).toFixed(1), muscle: i % 3 === 0 ? (24.3 - i * 0.02).toFixed(1) : '', waist1: i % 3 === 0 ? (68.5 + i * 0.1).toFixed(1) : '', waist2: i % 3 === 0 ? (74.0 + i * 0.1).toFixed(1) : '', measuredAt:'07:30' };
    db.activity[d] = { date:d, steps: String(4200 + ((i * 1777) % 6000)), water: '', waterLog: [[300, 500], [500, 300, 300], [300, 300, 500, 100]][i % 3].join(',') };
    db.activity[d].water = String(db.activity[d].waterLog.split(',').reduce((a, n) => a + +n, 0));
    if (i > 0) db.activity[d].score = String([3, 2, 2, 1, 3][i % 5]);
    if (i % 4 === 2) db.activity[d].drink = '1';
    const lb = [['💩👍'], ['💩👎', '더부룩함'], ['가스참'], ['💩👍']][i % 4];
    db.states.push({ id:nid(), date:d, time:'07:50', labels: lb });
    if (i % 3 === 0) db.workouts.push({ id:nid(), date:d, time:'07:10', name:'걷기(인클라인)', minutes:40, kcal:182, source:'manual' });
    if (i % 3 === 1) db.workouts.push({ id:nid(), date:d, time:'12:44', name:'전신근력운동', minutes:44, kcal:131, source:'edited' }, { id:nid(), date:d, time:'13:28', name:'걷기', minutes:36, kcal:168, source:'edited' });
  }
  // 변화 탭 미리보기용: 반년 치 신체·걸음·운동 기록 (5월 60kg대 → 지금 55kg대)
  for (let i = 3; i < 190; i++) {
    const d = addDays(today, -i), t = i / 190;
    if (db.activity[d]) continue;   // 위에서 이미 만든 날은 건너뛰기
    const wob = Math.sin(i * 1.7) * 0.35 + Math.sin(i * 0.37) * 0.25;
    if (i % 5 !== 2) db.body[d] = { date:d, weight:(55.9 + t * 4.3 + wob).toFixed(1), bodyFat:(20.8 + t * 6.5 + wob * 0.8).toFixed(1),
      bmi:(20.3 + t * 1.6 + wob * 0.3).toFixed(1), muscle: i % 2 ? (24.4 + Math.sin(i) * 0.4 - t * 0.2).toFixed(1) : '',
      waist1: i % 7 === 0 ? (68.8 + t * 4 + wob).toFixed(1) : '', waist2: i % 7 === 0 ? (74.2 + t * 4.5 + wob).toFixed(1) : '', measuredAt:'07:00' };
    db.activity[d] = { date:d, steps: String(3500 + ((i * 2311) % 7000)), water:'', waterLog:'', score: String([3, 2, 1, 3, 2, 2, 3, 1][(i * 7) % 8]), drink: i % 5 === 1 ? '1' : '' };
    if (i % 3 === 0) db.workouts.push({ id:nid(), date:d, time:'19:00', name: i % 2 ? '걷기(인클라인)' : '전신근력운동', minutes:35, kcal: 120 + (i * 37) % 120, source:'manual' });
  }
  db.diary[today] = '미리보기용 예시 일기예요. 실제 배포하면 내 기록이 보여요.';
  db.lastSync = today + ' 07:35';
  const byTime = (a, b) => String(a.time).localeCompare(String(b.time));
  return function(action, p){
    switch (action) {
      case 'init': return { settings: db.settings, lastSync: db.lastSync };
      case 'getDay': return {
        date: p.date,
        meals: db.meals.filter(m => m.date === p.date).sort(byTime),
        states: db.states.filter(s => s.date === p.date).sort(byTime),
        body: db.body[p.date] || null, activity: db.activity[p.date] || null,
        workouts: db.workouts.filter(w => w.date === p.date).sort(byTime),
        diary: db.diary[p.date] || '', lastSync: db.lastSync };
      case 'saveMeal': {
        let m = db.meals.find(x => x.id === p.id);
        if (!m) { m = { id:nid(), photoId:'' }; db.meals.push(m); }
        m.photoId = (p.items || []).map(it => { if (it.id) return it.id; const id = 'p' + nid(); db.photos[id] = it.data; return id; }).join(',');
        Object.assign(m, { date:p.date, time:p.time, tag:p.tag, memo:p.memo || '' });
        return m;
      }
      case 'deleteMeal': db.meals = db.meals.filter(x => x.id !== p.id); return true;
      case 'getPhotos': { const o = {}; (p.ids || []).forEach(id => { if (db.photos[id]) o[id] = db.photos[id]; }); return o; }
      case 'saveDayState':
        db.states = db.states.filter(x => x.date !== p.date);
        if (p.toilets) {
          const others = (p.labels || []).filter(l => !isToilet(l));
          if (others.length) db.states.push({ id:nid(), date:p.date, time:'', labels:others });
          p.toilets.forEach(t => db.states.push({ id:nid(), date:p.date, time:t.time, labels:[t.label] }));
        } else if ((p.labels || []).length) db.states.push({ id:nid(), date:p.date, time:p.time || '', labels:p.labels });
        return true;
      case 'importSheet': return { rows: 0, empty: true };
      case 'saveScore': { const f = {}; if ('score' in p) f.score = p.score; if ('drink' in p) f.drink = p.drink; db.activity[p.date] = Object.assign({ date:p.date }, db.activity[p.date], f); return true; }
      case 'saveState': { db.states = db.states.filter(x => x.id !== p.id); db.states.push({ id:p.id, date:p.date, time:p.time || '', labels:p.labels || [] }); return true; }
      case 'deleteState': db.states = db.states.filter(x => x.id !== p.id); return true;
      case 'importBody': { let added = 0, updated = 0; (p.rows || []).forEach(x => { if (db.body[x.date]) updated++; else added++; db.body[x.date] = Object.assign({ date:x.date }, db.body[x.date], { weight:x.weight, bodyFat:x.bodyFat, bmi:x.bmi, muscle:x.muscle }); }); return { added, updated }; }
      case 'saveBody': db.body[p.date] = Object.assign({ date:p.date }, db.body[p.date], { weight:p.weight, bodyFat:p.bodyFat, bmi:p.bmi, muscle:p.muscle, waist1:p.waist1, waist2:p.waist2 }); return db.body[p.date];
      case 'saveWorkout': {
        let w = db.workouts.find(x => x.id === p.id);
        if (!w) { w = { id:nid() }; db.workouts.push(w); }
        Object.assign(w, { date:p.date, time:p.time, name:p.name, minutes:p.minutes, kcal:p.kcal, source:p.source || 'manual' }); return w;
      }
      case 'deleteWorkout': db.workouts = db.workouts.filter(x => x.id !== p.id); return true;
      case 'saveDiary': db.diary[p.date] = p.text || ''; return true;
      case 'saveWater': {
        const log = (p.log || []).filter(n => n > 0);
        db.activity[p.date] = Object.assign({ date:p.date }, db.activity[p.date], { water:String(log.reduce((a, n) => a + n, 0)), waterLog:log.join(',') });
        return true;
      }
      case 'getAllMonths': {
        const out = {}, yms = new Set(Object.keys(db.body).concat(Object.keys(db.activity), db.workouts.map(w => w.date), db.states.map(x => x.date)).map(d => d.slice(0, 7)));
        yms.forEach(ym => { out[ym] = demoApi('getMonth', { ym }); });
        return out;
      }
      case 'getMonth': {
        const days = {}, at = d => (days[d] = days[d] || { meals:0, states:0, toilet:[], labels:[], workouts:[] }), inM = d => d.indexOf(p.ym) === 0;
        db.meals.filter(m => inM(m.date)).forEach(m => at(m.date).meals++);
        db.states.filter(s => inM(s.date)).forEach(s => { const o = at(s.date); o.states++; s.labels.forEach(l => o.labels.push(l)); s.labels.filter(isToilet).forEach(l => { const ic = toiletIcon(l); if (o.toilet.indexOf(ic) < 0) o.toilet.push(ic); }); });
        db.workouts.filter(w => inM(w.date)).forEach(w => at(w.date).workouts.push({ name:w.name, minutes:w.minutes, kcal:w.kcal }));
        Object.values(db.activity).filter(a => inM(a.date)).forEach(a => { at(a.date).steps = a.steps; at(a.date).score = a.score; at(a.date).drink = a.drink; });
        Object.values(db.body).filter(b => inM(b.date)).forEach(b => { const o = at(b.date); o.weight = b.weight; o.bodyFat = b.bodyFat; o.bmi = b.bmi; o.muscle = b.muscle; o.waist1 = b.waist1; o.waist2 = b.waist2; o.waist = has(b.waist1) || has(b.waist2) ? 1 : 0; });
        return days;
      }
      case 'search': {
        const ws = String(p.q || '').toLowerCase().split(/\s+/).filter(Boolean), hit = t => { t = String(t || '').toLowerCase(); return ws.some(w => t.indexOf(w) >= 0); };
        return { meals: db.meals.filter(m => hit(m.memo)).map(m => ({ id:m.id, date:m.date, time:m.time, tag:m.tag, memo:m.memo })),
                 diary: Object.keys(db.diary).filter(d => hit(db.diary[d])).map(d => ({ date:d, text:db.diary[d] })) };
      }
      case 'saveSettings': db.settings = p.settings; return db.settings;
      case 'searchSchool': return [
        { name:'아천초등학교', office:'경상북도교육청', officeCode:'R10', code:'0000001', addr:'경상북도 김천시 (예시)' },
        { name:'아천초등학교능치분교장', office:'경상북도교육청', officeCode:'R10', code:'0000002', addr:'경상북도 김천시 어모면 (예시)' }
      ];
      case 'getRange': {
        const days = {};
        for (let d = p.from; d <= p.to; d = addDays(d, 1)) days[d] = demoApi('getDay', { date: d });
        return { days, lastSync: db.lastSync };
      }
      case 'getLunch': return { dishes: ['잡곡밥', '쇠고기미역국', '닭갈비', '시금치나물', '배추김치', '요구르트'] };
    }
    throw new Error('알 수 없는 요청: ' + action);
  };
})();

/* ───── 서버 호출 ───── */
function call(action, payload){
  if (DEMO) {
    return new Promise((resolve, reject) => setTimeout(() => {
      try { resolve(JSON.parse(JSON.stringify(demoApi(action, JSON.parse(JSON.stringify(payload || {})))))); }
      catch(e){ reject(e); }
    }, 120));
  }
  if (!IN_GAS) {
    return fetch(EXEC, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 이렇게 보내야 다른 사이트에서도 막히지 않아요
      body: JSON.stringify({ api: 1, action, payload: payload || {} })
    }).then(res => {
      if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
      return res.json();
    }).then(r => {
      if (!r) throw new Error('응답이 없어요');
      if (r.error) throw new Error(r.error);
      return r.data;
    });
  }
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => {
        if (!r) return reject(new Error('응답이 없어요'));
        if (r.error) return reject(new Error(r.error));
        resolve(r.data);
      })
      .withFailureHandler(err => reject(err instanceof Error ? err : new Error(String(err))))
      .api(action, payload || {});
  });
}
function fail(e){ toast('오류: ' + ((e && e.message) || e)); }
/* 화면에는 먼저 반영하고, 서버 저장은 뒤에서 해요.
 * 보낼 내용은 먼저 휴대폰에 '보낼 목록'으로 적어 두고 차례로 보내요.
 * 보내는 중에 앱을 닫아도 다음에 열 때 남은 것부터 다시 보내요. */
function qLoad(){ try { return JSON.parse(localStorage.getItem('md_queue') || '[]'); } catch(e){ return []; } }
function qSave(q){ try { localStorage.setItem('md_queue', JSON.stringify(q)); qBadge(); return true; } catch(e){ return false; } }

/* 보낼 사진은 '보낼 목록'(작은 저장소)에 직접 넣지 않고, 큰 저장소(IndexedDB 'outbox')에 따로 먼저 적어 둬요.
 * 목록에는 사진의 이름표(ref)만 적어서, 사진이 커도 목록이 넘치지 않아요.
 * 서버 저장이 끝난 뒤에만 지워요 → 앱이 닫히거나 인터넷이 끊겨도 사진이 남아 있어요. */
const memOut = {};   // 앱이 켜져 있는 동안의 사본
let outboxWrites = Promise.resolve();
async function outboxPut(map){
  let ok = false;
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const tx = db.transaction('outbox', 'readwrite'), st = tx.objectStore('outbox');
      Object.keys(map).forEach(k => st.put(map[k], k));
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
    ok = true;
  } catch(e){}
  if (!ok) Object.keys(map).forEach(k => { try { localStorage.setItem('md_ob_' + k, map[k]); } catch(e){} });   // 큰 저장소가 안 열리면 작은 저장소에라도
}
async function outboxGet(k){
  if (memOut[k]) return memOut[k];
  try {
    const db = await idb();
    const v = await new Promise(res => { const q = db.transaction('outbox').objectStore('outbox').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
    if (v) return v;
  } catch(e){}
  try { return localStorage.getItem('md_ob_' + k); } catch(e){ return null; }
}
async function outboxDel(keys){
  keys.forEach(k => { delete memOut[k]; try { localStorage.removeItem('md_ob_' + k); } catch(e){} });
  try { const db = await idb(), st = db.transaction('outbox', 'readwrite').objectStore('outbox'); keys.forEach(k => st.delete(k)); } catch(e){}
}
const refsOf = it => ((it.payload && it.payload.items) || []).map(x => x.ref).filter(Boolean);
// 목록의 이름표를 실제 사진으로 바꿔서 보낼 준비
async function hydrate(payload){
  if (!payload || !Array.isArray(payload.items) || !payload.items.some(x => x.ref)) return payload;
  const items = [];
  for (const x of payload.items) {
    if (!x.ref) { items.push(x); continue; }
    const data = await outboxGet(x.ref);
    if (!data) throw new Error('보낼 사진을 휴대폰에서 찾지 못했어요');
    const y = Object.assign({}, x, { data }); delete y.ref; items.push(y);
  }
  return Object.assign({}, payload, { items });
}

let pendingSaves = 0;
// 화면 위 알림: 보내는 중에만 '저장 중…' (실패해서 기다리는 동안은 아무것도 안 띄우고 알아서 다시 보내요)
function qBadge(){
  const el = $('#saving'); if (!el) return;
  const n = DEMO ? 0 : qLoad().length;
  if (flushing || pendingSaves) { el.textContent = n > 1 ? `저장 중… (${n})` : '저장 중…'; el.classList.add('show'); el.classList.remove('wait'); }
  else { el.textContent = '저장 중…'; el.classList.remove('show', 'wait'); }
}
function bg(promise){   // 미리보기용
  pendingSaves++; qBadge();
  return promise.catch(e => { toast('저장하지 못했어요: ' + ((e && e.message) || e)); })
    .finally(() => { pendingSaves--; qBadge(); if (!pendingSaves && !flushing) loadDay(); });
}
let editSeq = 0;   // 저장할 때마다 1씩 늘려서, 그 전에 출발한 '불러오기' 응답이 방금 입력한 내용을 덮어쓰지 않게 해요
const editAt = {};   // 날짜별 마지막 입력 번호
function send(action, payload){
  editSeq++; if (payload && payload.date) editAt[payload.date] = editSeq;
  if (DEMO) return bg(call(action, payload));
  let p = payload;
  if (payload && Array.isArray(payload.items) && payload.items.some(x => x.data)) {
    const map = {};
    p = Object.assign({}, payload, { items: payload.items.map(x => {
      if (!x.data) return x;
      const k = 'ob' + tmpId(); map[k] = x.data;
      const y = Object.assign({}, x, { ref: k }); delete y.data; return y;
    }) });
    Object.assign(memOut, map);
    outboxWrites = outboxWrites.then(() => outboxPut(map));
  }
  const q = qLoad(); q.push({ action, payload: p, qid: tmpId() });
  if (!qSave(q)) {   // 아주 드물게 목록조차 못 적으면: 화면을 켜 둔 동안 보내고 실패는 크게 알려줘요
    hydrate(p).then(full => bg(call(action, full).then(res => { if (action === 'saveMeal') keepSentPhotos(full, res); outboxDel(refsOf({ payload: p })); })));
    toast('휴대폰 저장 공간이 부족해요. 저장 중… 이 사라질 때까지 앱을 닫지 마세요');
    return;
  }
  flush();
}
let flushing = false;
async function flush(){
  if (flushing || DEMO) return;
  if (!qLoad().length) { qBadge(); return; }
  flushing = true; qBadge();
  try {
    await outboxWrites.catch(() => {});
    const failed = new Set();   // 이번 차례에 실패한 항목 (한 바퀴 돌면 멈춰요)
    while (true) {
      const q = qLoad(); if (!q.length) break;
      const it = q[0];
      if (it.qid && failed.has(it.qid)) break;   // 한 바퀴 다 돌았어요
      try {
        const full = await hydrate(it.payload);
        const res = await call(it.action, full);
        if (it.action === 'saveMeal') keepSentPhotos(full, res);
        const q2 = qLoad(); const done = q2.shift(); qSave(q2);
        outboxDel(refsOf(done || it));
      } catch(e){
        const q2 = qLoad(); if (!q2.length) break;
        const msg = String((e && e.message) || e);
        const x = q2.shift(); x.tries = (x.tries || 0) + 1; x.lastErr = msg; x.qid = x.qid || tmpId();
        // 실패해도 절대 버리지 않아요. 맨 뒤로 보내서 다른 기록이 먼저 저장되게 하고, 다음에 다시 보내요
        q2.push(x); qSave(q2); failed.add(x.qid);
        if (/알 수 없는 요청/.test(msg) && !flush.warned) { flush.warned = 1; toast('서버(Code.gs)를 새 버전으로 배포하면 저장돼요'); }
        else if (/Failed to fetch|NetworkError|Load failed|network|시간/i.test(msg)) break;   // 인터넷 문제면 잠시 뒤 다시
      }
    }
  } finally {
    flushing = false; qBadge();
    // 남은 게 있으면 알아서 다시 보내요: 3초 → 10초 → 30초 → 그 뒤로 1분마다
    clearTimeout(flush.timer);
    if (qLoad().length) {
      const waits = [3000, 10000, 30000, 60000];
      flush.timer = setTimeout(flush, waits[Math.min(flush.round || 0, waits.length - 1)]);
      flush.round = (flush.round || 0) + 1;
    } else flush.round = 0;
    loadDay(true);   // 보낸 뒤에는 늘 서버의 최신 기록을 받아와요
  }
}
// 내가 올린 사진은 서버가 붙인 진짜 이름으로 휴대폰에 저장 → 다음에 열 때 드라이브에서 다시 받지 않아요
function keepSentPhotos(payload, meal){
  try {
    const items = payload.items || [], ids = photoIds(meal);
    if (items.length !== ids.length) return;
    const map = {};
    items.forEach((it, i) => { if (it.data) map[ids[i]] = it.data; });
    if (!Object.keys(map).length) return;
    Object.assign(S.photos, map);
    if (!DEMO) idbPutMany(map);
  } catch(e){}
}
function cacheDay(){ if (!DEMO && S.day) lsSet('md_day_' + S.day.date, JSON.stringify(S.day)); }
function tmpId(){ return 'tmp' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2300); }

/* ───── 오늘 화면 ───── */
// 보내는 중인 저장이 화면의 어느 칸을 바꾸는지
const PEND_FIELD = { saveMeal: 'meals', deleteMeal: 'meals', saveState: 'states', deleteState: 'states', saveBody: 'body',
  saveWater: 'activity', saveScore: 'activity', saveWorkout: 'workouts', deleteWorkout: 'workouts', saveDiary: 'diary', saveSettings: 'none' };
async function loadDay(afterFlush){
  const date = S.date;
  if (!DEMO && (!S.day || S.day.date !== date)) {
    let c = null;
    try { c = JSON.parse(lsGet('md_day_' + date) || 'null'); } catch(e){}
    if (c) { S.day = c; renderToday(); loadPhotos(c.meals); }
    else {
      // 저장본이 없는 날도 날짜는 바로 넘어가요: 빈 화면을 먼저 보여주고 서버 기록이 오면 채워요
      S.day = { date, meals: [], states: [], body: null, activity: null, workouts: [], diary: '', _blank: date <= todayStr() }; renderToday();
      if (date > todayStr()) prefetchRange(date, addDays(date, 7), 0);
      else prefetchRange(addDays(date, -14), date, 0);   // 그 앞 2주를 한꺼번에 받아둬요
    }
  }
  // 보낼 저장이 남아 있으면 뒤에서 보내고, 날짜 이동·불러오기는 기다리지 않아요
  if (!DEMO && !afterFlush && qLoad().length) flush();
  $('#todayBody').style.opacity = S.day && S.day._blank ? .5 : 1;
  try {
    const seq = editSeq;
    const d = await call('getDay', { date });
    if (date !== S.date) return;
    if (d.lastSync) S.lastSync = d.lastSync;
    // 방금 새로 입력했으면 화면을 그대로 둬요 (저장이 끝나면 다시 받아와요)
    if ((editAt[date] || 0) > seq) return;
    // 아직 서버로 안 간 입력이 있으면, 그 칸(예: 식사)만 휴대폰 것을 쓰고 나머지(예: 동기화된 체중)는 서버 것으로 바꿔요
    const pend = qLoad().filter(x => x.payload && x.payload.date === date);
    let nd = d;
    if (pend.length) {
      const keys = new Set(pend.map(x => PEND_FIELD[x.action] || '*'));
      if (keys.has('*') || !S.day || S.day.date !== date) return;
      nd = Object.assign({}, d);
      keys.forEach(k => { if (k !== 'none') nd[k] = S.day[k]; });
    }
    S.day = nd;
    if (!DEMO && !pend.length) lsSet('md_day_' + date, JSON.stringify(d));
    renderToday();
    loadPhotos(d.meals);
  } catch(e){ fail(e); }
  finally { $('#todayBody').style.opacity = 1; }
}

/* 여러 날을 한 번에 받아 휴대폰에 저장 (사진은 photoDays일치만 미리 받아요) */
const fetchedRanges = {};
async function prefetchRange(from, to, photoDays){
  const key = from + '~' + to; if (fetchedRanges[key]) return; fetchedRanges[key] = 1;
  try {
    const seq = editSeq;
    const r = await call('getRange', { from, to });
    if (qLoad().length || seq !== editSeq) { delete fetchedRanges[key]; return; }   // 아직 보낼 기록이 있으면 휴대폰 화면을 덮어쓰지 않아요
    for (let d = from; d <= to; d = addDays(d, 1)) {
      const day = Object.assign({ date: d, meals: [], states: [], body: null, activity: null, workouts: [], diary: '' }, r.days[d] || {}, { lastSync: r.lastSync });
      lsSet('md_day_' + d, JSON.stringify(day));
    }
    if (photoDays) {
      const meals = [];
      const pEnd = to < todayStr() ? to : todayStr();   // 사진은 오늘까지 기준 최근 photoDays일
      for (let d = addDays(pEnd, -(photoDays - 1)); d <= pEnd; d = addDays(d, 1)) if (r.days[d]) meals.push(...r.days[d].meals);
      loadPhotos(meals);
    }
  } catch(e){ delete fetchedRanges[key]; }
}

/* 사진은 휴대폰(IndexedDB)에 저장해 두고 다음부터는 바로 보여줘요 */
let idbP = null;
function idb(){
  // 일부 아이폰에서 저장 공간 열기가 멈추는 경우가 있어서, 1.5초 안에 안 열리면 건너뛰어요
  if (!idbP) idbP = Promise.race([
    new Promise((res, rej) => {
      try { const r = indexedDB.open('mealday', 2); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked')); }
      catch(e){ rej(e); }
    }),
    new Promise((_, rej) => setTimeout(() => rej(new Error('idb timeout')), 1500))
  ]).catch(e => { idbP = Promise.reject(e); idbP.catch(() => {}); throw e; });
  return idbP;
}
async function idbGetMany(keys){
  const out = {};
  try {
    const db = await idb();
    await Promise.all(keys.map(k => new Promise(res => {
      const q = db.transaction('photos').objectStore('photos').get(k);
      q.onsuccess = () => { if (q.result) out[k] = q.result; res(); }; q.onerror = () => res();
    })));
  } catch(e){}
  return out;
}
async function idbPutMany(map){
  try {
    const db = await idb(), tx = db.transaction('photos', 'readwrite'), st = tx.objectStore('photos');
    Object.keys(map).forEach(k => st.put(map[k], k));
  } catch(e){}
}

function photoIds(m){ return String((m && m.photoId) || '').split(',').filter(Boolean); }
const photoBusy = new Map();   // 불러오는 중인 사진 → 끝나면 풀리는 약속 (같은 사진을 또 요청하지 않고 기다려요)
async function loadPhotos(meals){
  const ids = [...new Set(meals.flatMap(photoIds).filter(id => !S.photos[id] && !/^tmp/.test(id)))];
  if (!ids.length) return;
  const waits = ids.filter(id => photoBusy.has(id)).map(id => photoBusy.get(id));
  const need = ids.filter(id => !photoBusy.has(id));
  if (need.length) {
    const job = loadPhotos_(need);
    need.forEach(id => photoBusy.set(id, job));
    job.finally(() => need.forEach(id => { if (photoBusy.get(id) === job) photoBusy.delete(id); }));
    waits.push(job);
  }
  await Promise.all(waits.map(w => w.catch(() => {})));
}
// 사진 받기 요청은 앱 전체에서 동시에 3개까지만 (서버가 버거워하지 않게)
let photoSlots = 3; const photoWait = [];
async function photoCall(ids){
  if (photoSlots > 0) photoSlots--; else await new Promise(r => photoWait.push(r));
  try { return await call('getPhotos', { ids }); }
  finally { const next = photoWait.shift(); if (next) next(); else photoSlots++; }
}
async function loadPhotos_(need){
  let cached = {};
  if (!DEMO) { try { cached = await Promise.race([idbGetMany(need), new Promise(r => setTimeout(() => r({}), 2000))]); } catch(e){ cached = {}; } }
  if (Object.keys(cached).length) { Object.assign(S.photos, cached); applyPhotos(); }
  need = need.filter(id => !S.photos[id]);
  // 남은 사진은 4장씩 묶어서, 3묶음까지 동시에 받아요 (받는 대로 바로 보여줘요)
  const groups = [];
  for (let i = 0; i < need.length; i += 4) groups.push(need.slice(i, i + 4));
  const worker = async () => {
    while (groups.length) {
      const g = groups.shift();
      try {
        const r = await photoCall(g);
        Object.assign(S.photos, r); applyPhotos();
        if (!DEMO) idbPutMany(r);
      } catch(e){}
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}
function applyPhotos(){
  document.querySelectorAll('img[data-photo]').forEach(img => {
    const src = S.photos[img.dataset.photo];
    if (src && img.getAttribute('src') !== src) img.setAttribute('src', src);
  });
}

function waterMl(day){
  const dd = day || S.day, a = dd && dd.activity; if (!a) return 0;
  const log = String(a.waterLog || '').split(',').flatMap(t => { t = String(t).trim(); return /^\d+$/.test(t) && t.length > 4 && t.length % 3 === 0 ? t.match(/\d{3}/g) : [t]; }).map(Number).filter(n => n > 0);
  return log.length ? log.reduce((x, y) => x + y, 0) : +(a.water || 0);   // 잔별 기록이 있으면 그걸 더한 값
}
function fmtMl(n){ return Number(n).toLocaleString('ko-KR') + 'ml'; }
function waterHtml(){
  return `<button class="water" data-act="water"><span>💧 물 섭취</span><b class="mono" style="font-weight:800">${fmtMl(waterMl())}</b><span>＋</span></button>`;
}
function openWaterSheet(){
  const a = (S.day && S.day.activity) || {};
  // 예전에 시트가 '300,100,500'을 숫자 300100500으로 바꿔 저장한 경우도 세 자리씩 되살려요
  const fix = t => { t = String(t).trim(); return /^\d+$/.test(t) && t.length > 4 && t.length % 3 === 0 ? t.match(/\d{3}/g) : [t]; };

function resizeImage(file, max, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w*s); h = Math.round(h*s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

/* 사진 편집: 90° 회전 + 자유 비율 자르기. 바뀐 게 없으면 null */
function openPhotoEditor(src){
  return new Promise(resolve => {
    const img = new Image();
    img.onerror = () => { toast('사진을 열지 못했어요'); resolve(null); };
    img.onload = () => {
      const el = document.createElement('div'); el.className = 'pe';
      el.innerHTML = `<div class="pe-top"><button data-a="cancel">취소</button><button class="ok" data-a="ok">완료</button></div>
        <div class="pe-stage"><div class="pe-wrap"><canvas></canvas><div class="pe-box"><i class="pe-h tl" data-h="tl"></i><i class="pe-h tr" data-h="tr"></i><i class="pe-h bl" data-h="bl"></i><i class="pe-h br" data-h="br"></i></div></div></div>
        <div class="pe-bot"><button data-a="rot">↺ 회전</button><button data-a="reset">원래대로</button></div>`;
      document.body.appendChild(el);
      const stage = el.querySelector('.pe-stage'), wrap = el.querySelector('.pe-wrap'), cv = el.querySelector('canvas'), box = el.querySelector('.pe-box');
      let rot = 0, crop = { x: 0, y: 0, w: 1, h: 1 }, W = 0, H = 0;   // crop: 돌린 사진 기준 0~1
      const rotated = maxSide => {   // 돌린 사진 전체를 캔버스로
        const sw = img.naturalWidth, sh = img.naturalHeight, side = rot % 2;
        const k = Math.min(1, maxSide / Math.max(sw, sh));
        const w = Math.round((side ? sh : sw) * k), h = Math.round((side ? sw : sh) * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const g = c.getContext('2d'); g.translate(w / 2, h / 2); g.rotate(rot * Math.PI / 2);
        g.drawImage(img, -sw * k / 2, -sh * k / 2, sw * k, sh * k); return c;
      };
      const layout = () => {
        const pad = 22, sw = stage.clientWidth - pad * 2, sh = stage.clientHeight - pad * 2;
        const iw = rot % 2 ? img.naturalHeight : img.naturalWidth, ih = rot % 2 ? img.naturalWidth : img.naturalHeight;
        const k = Math.min(sw / iw, sh / ih); W = Math.round(iw * k); H = Math.round(ih * k);
        Object.assign(wrap.style, { width: W + 'px', height: H + 'px', left: (stage.clientWidth - W) / 2 + 'px', top: (stage.clientHeight - H) / 2 + 'px' });
        const c = rotated(Math.max(W, H) * 2); cv.width = c.width; cv.height = c.height; cv.getContext('2d').drawImage(c, 0, 0);
        paint();
      };
      const paint = () => Object.assign(box.style, { left: crop.x * W + 'px', top: crop.y * H + 'px', width: crop.w * W + 'px', height: crop.h * H + 'px' });
      layout();
      // 끌기: 변·모서리 근처(손가락 넓이만큼) = 그쪽 크기 조절, 상자 안쪽 = 옮기기
      // 손잡이 그림이 아니라 '위치'로 판단해서, 변 아무 데나 잡아도 되고 사진 가장자리 바깥쪽을 눌러도 잡혀요
      let drag = null;
      const MIN = 0.08, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), T = 30;
      const down = e => {
        if (!e.target.closest('.pe-stage')) return;
        const r = box.getBoundingClientRect(), px = e.clientX, py = e.clientY;
        const inX = px > r.left - T && px < r.right + T, inY = py > r.top - T && py < r.bottom + T;
        if (!inX || !inY) return;
        const dl = Math.abs(px - r.left), dr = Math.abs(px - r.right), dt = Math.abs(py - r.top), db = Math.abs(py - r.bottom);
        let hx = '', hy = '';
        if (Math.min(dl, dr) < T) hx = dl <= dr ? 'l' : 'r';
        if (Math.min(dt, db) < T) hy = dt <= db ? 't' : 'b';
        // 작은 상자에서 안쪽 깊숙이 누르면 옮기기
        if (hx && px > r.left + T * 0.6 && px < r.right - T * 0.6 && r.width < T * 3) hx = '';
        if (hy && py > r.top + T * 0.6 && py < r.bottom - T * 0.6 && r.height < T * 3) hy = '';
        const inside = px >= r.left && px <= r.right && py >= r.top && py <= r.bottom;
        if (!hx && !hy && !inside) return;
        e.preventDefault();
        drag = { h: hx || hy ? hx + hy : 'move', x: px, y: py, c: Object.assign({}, crop) };
      };
      const move = e => {
        if (!drag) return; e.preventDefault();
        const dx = (e.clientX - drag.x) / W, dy = (e.clientY - drag.y) / H, c = drag.c;
        let { x, y, w, h } = c;
        if (drag.h === 'move') { x = clamp(c.x + dx, 0, 1 - c.w); y = clamp(c.y + dy, 0, 1 - c.h); }
        else {
          const hs = drag.h;
          if (hs.includes('l')) { x = clamp(c.x + dx, 0, c.x + c.w - MIN); w = c.x + c.w - x; }
          else if (hs.includes('r')) w = clamp(c.w + dx, MIN, 1 - c.x);
          if (hs.includes('t')) { y = clamp(c.y + dy, 0, c.y + c.h - MIN); h = c.y + c.h - y; }
          else if (hs.includes('b')) h = clamp(c.h + dy, MIN, 1 - c.y);
        }
        crop = { x, y, w, h }; paint();
      };
      const up = () => { drag = null; };
      el.addEventListener('pointerdown', down);
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
      window.addEventListener('resize', layout);
      const close = out => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up); window.removeEventListener('resize', layout);
        el.remove(); resolve(out);
      };
      el.querySelector('.pe-top').onclick = el.querySelector('.pe-bot').onclick = e => {
        const a = (e.target.closest('[data-a]') || {}).dataset; if (!a || !a.a) return;
        if (a.a === 'cancel') close(null);
        else if (a.a === 'rot') { rot = (rot + 3) % 4;   // 왼쪽(반시계)으로 90°
 crop = { x: 0, y: 0, w: 1, h: 1 }; layout(); }
        else if (a.a === 'reset') { rot = 0; crop = { x: 0, y: 0, w: 1, h: 1 }; layout(); }
        else if (a.a === 'ok') {
          const full = crop.x < 0.005 && crop.y < 0.005 && crop.w > 0.99 && crop.h > 0.99;
          if (!rot && full) { close(null); return; }
          const R = rotated(4000);
          const sx = Math.round(crop.x * R.width), sy = Math.round(crop.y * R.height);
          const sw = Math.max(1, Math.round(crop.w * R.width)), sh = Math.max(1, Math.round(crop.h * R.height));
          const k = Math.min(1, 1280 / Math.max(sw, sh));
          const o = document.createElement('canvas'); o.width = Math.round(sw * k); o.height = Math.round(sh * k);
          o.getContext('2d').drawImage(R, sx, sy, sw, sh, 0, 0, o.width, o.height);
          close(o.toDataURL('image/jpeg', 0.82));
        }
      };
    };
    img.src = src;
  });
}

/* 사진 크게 보기: 올린 사진들을 한 장처럼 나란히(2장은 좌우, 3~4장은 2×2) 크게 보여줘요.
 * 두 손가락으로 벌리거나 두 번 톡 치면 확대, 확대한 상태에서는 끌어서 이동. ✕ 나 빈 곳을 누르면 닫혀요. */
function openPhotoViewer(ids){
  const srcs = ids.map(id => S.photos[id] || '').filter(Boolean);
  if (!srcs.length) { toast('사진을 불러오는 중이에요'); return; }
  const cols = srcs.length === 1 ? 1 : 2;
  const el = document.createElement('div'); el.className = 'pv';
  el.innerHTML = `<button class="pv-x" aria-label="닫기">✕</button>
    <div class="pv-stage"><div class="pv-grid" style="grid-template-columns:repeat(${cols},1fr)">${srcs.map(s => `<img src="${s}" alt="" style="max-height:calc((100vh - 140px) / ${Math.ceil(srcs.length / cols)});object-fit:contain">`).join('')}</div></div>`;
  document.body.appendChild(el);
  const grid = el.querySelector('.pv-grid'), stage = el.querySelector('.pv-stage');
  let sc = 1, tx = 0, ty = 0;
  const apply = () => { grid.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  const clampPan = () => {
    const w = stage.clientWidth, h = stage.clientHeight, gw = grid.offsetWidth * sc, gh = grid.offsetHeight * sc;
    const mx = Math.max(0, (gw - w) / 2), my = Math.max(0, (gh - h) / 2);
    tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty));
  };
  const close = () => { el.remove(); };
  el.querySelector('.pv-x').onclick = close;
  const pts = new Map(); let start = null, moved = false, lastTap = 0;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('.pv-x')) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
    const p = [...pts.values()];
    start = p.length === 2
      ? { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), sc, tx, ty }
      : { x: e.clientX, y: e.clientY, tx, ty };
  });
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !start) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = [...pts.values()];
    if (p.length === 2 && start.d) {
      sc = Math.max(1, Math.min(5, start.sc * Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) / start.d)); moved = true;
    } else if (p.length === 1 && start.x != null && sc > 1) {
      tx = start.tx + (e.clientX - start.x); ty = start.ty + (e.clientY - start.y);
      if (Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) > 6) moved = true;
    } else if (p.length === 1 && start.x != null && Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) > 6) moved = true;
    clampPan(); apply();
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size) { const q = [...pts.values()][0]; start = { x: q.x, y: q.y, tx, ty }; return; }
    if (sc <= 1.02) { sc = 1; tx = 0; ty = 0; apply(); }
    if (!moved && e.type === 'pointerup') {
      const now = Date.now();
      if (now - lastTap < 300) {   // 두 번 톡: 2.5배 ↔ 원래대로
        lastTap = 0;
        if (sc > 1) { sc = 1; tx = 0; ty = 0; }
        else { sc = 2.5; const r = stage.getBoundingClientRect(); tx = -(e.clientX - r.left - r.width / 2) * 1.5; ty = -(e.clientY - r.top - r.height / 2) * 1.5; clampPan(); }
        grid.style.transition = 'transform .2s'; apply(); setTimeout(() => grid.style.transition = '', 220);
      } else {
        lastTap = now;
        const onImg = !!e.target.closest('img');
        if (!onImg && sc === 1) setTimeout(() => { if (lastTap === now) close(); }, 300);   // 빈 곳 한 번 톡 = 닫기
      }
    }
    start = null;
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}

  const items = photoIds(m).map(id => /^tmp/.test(id) ? (S.photos[id] ? { data: S.photos[id] } : null) : { id }).filter(Boolean);

        <textarea id="mMemo" rows="3" placeholder="무엇을 먹었나요? 메모를 남겨보세요.">${esc(m.memo)}</textarea></div>
      ${isNew ? '' : '<button class="del-btn" id="mDelete">이 기록 삭제</button>'}`,
    mount(){

      let sel = tagIdsOf(m.tag);
      const paintTag = () => {

        document.querySelectorAll('#mTagPick [data-tag]').forEach(b => b.classList.toggle('on', sel.indexOf(b.dataset.tag) >= 0));
      };
      paintTag();
      $('#mTag').onclick = () => $('#mTagPick').classList.toggle('hidden');
      $('#mTagPick').onclick = e => {
        const b = e.target.closest('[data-tag]'); if (!b) return;
        const id = b.dataset.tag, i = sel.indexOf(id);
        if (i >= 0) sel.splice(i, 1); else sel.push(id);
        paintTag();
      };
      const paintPhotos = () => {
        const box = $('#mPhotos'); if (!box) return;
        // 사진이 없으면 '＋ 사진 추가' 버튼 하나, 있으면 사진 옆에 ＋ 칸
        box.innerHTML = items.length
          ? `<div class="ph-grid" style="margin:0">${items.map((it, i) => {
              const src = it.data || S.photos[it.id] || '';
              return `<div class="ph" data-edit="${i}">${src ? `<img src="${src}" alt=""><span class="ed">✎ 편집</span>` : ''}<button class="rm" data-rm="${i}" aria-label="사진 빼기">✕</button></div>`;
            }).join('')}<button class="ph-add" data-pick="1" aria-label="사진 추가"><b>＋</b></button></div>`
          : `<div class="ph-row"><button class="ph-add" data-pick="1"><b>＋</b>사진 추가</button></div>`;
      };
      paintPhotos();
      const missing = items.filter(it => it.id && !S.photos[it.id]).map(it => it.id);
      if (missing.length) call('getPhotos', { ids: missing }).then(r => { Object.assign(S.photos, r); paintPhotos(); }).catch(() => {});
      $('#mPhotos').onclick = e => {
        const rm = e.target.closest('[data-rm]');
        if (rm) { items.splice(+rm.dataset.rm, 1); paintPhotos(); return; }
        const pk = e.target.closest('[data-pick]');
        if (pk) { pickPhoto(list => { list.forEach(data => items.push({ data })); paintPhotos(); }); return; }
        // 사진을 누르면 회전·자르기 (필요할 때만)
        const ed = e.target.closest('[data-edit]');
        if (ed) {
          const it = items[+ed.dataset.edit]; if (!it) return;
          const src = it.data || S.photos[it.id];
          if (!src) { toast('사진을 불러오는 중이에요'); return; }
          openPhotoEditor(src).then(out => { if (out) { items[+ed.dataset.edit] = { data: out }; paintPhotos(); } });
        }
      };
      if ($('#mLunch')) $('#mLunch').onclick = e => loadLunch(e.currentTarget);
      // ⭐ 즐겨찾기: 이름(예: 오나오)을 누르면 등록해 둔 상세 내용(예: 오트밀 3숟…)이 메모에 들어가요
      // favMode: 'list' = 이름 목록, 'edit' = 이름을 누르면 수정, 'form' = 추가/수정 입력창
      let favMode = 'list', favIdx = -1;
      const svg = d => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
      const ICON_PEN = svg('<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>');
      const ICON_CHECK = svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>');
      const ICON_PLUS = svg('<path d="M12 5v14M5 12h14"/>');
      const favs = () => {
        // 예전 형식(이름만 저장)도 { name, text } 로 바꿔서 써요
        S.settings.favs = (S.settings.favs || []).map(f => typeof f === 'string' ? { name: f, text: f } : f);
        return S.settings.favs;
      };
      const paintFav = () => {
        const list = favs(), pn = $('#mFavPanel');
        if (favMode === 'form') {
          const f = favIdx >= 0 ? list[favIdx] : { name: '', text: '' };
          pn.innerHTML = `
            <div class="fav-form">
              <label>이름</label><input id="mFavName" maxlength="20" placeholder="예: 오나오" value="${esc(f.name)}">
              <label>메모에 들어갈 내용</label><textarea id="mFavText" rows="3" placeholder="예: 오트밀 3숟, 그릭요거트, 바나나 반 개">${esc(f.text)}</textarea>
              <div class="fav-actions">${favIdx >= 0 ? '<button class="fav-del" data-fa="del">삭제</button>' : ''}<span style="flex:1"></span><button class="fav-sub" data-fa="cancel">취소</button><button class="fav-main" data-fa="save">저장</button></div>
            </div>`;
          setTimeout(() => { const n = $('#mFavName'); if (n && !n.value) n.focus(); }, 30);
          return;
        }
        const edit = favMode === 'edit';
        pn.innerHTML = `
          ${list.length ? `<div class="fav-list">${list.map((f, i) => `<button class="fav-chip${edit ? ' edit' : ''}" data-fav="${i}">${esc(f.name)}${edit ? ' <span class="pen">✎</span>' : ''}</button>`).join('')}</div>`
            : '<p class="fav-empty">아직 즐겨찾기가 없어요. ＋ 추가를 눌러 등록해 주세요.</p>'}
          ${edit ? '<p class="fav-empty" style="margin-top:8px">고칠 즐겨찾기를 눌러 주세요.</p>' : ''}
          <div class="fav-actions" style="margin-top:10px"><span style="flex:1"></span>${list.length ? `<button class="fav-sub fav-ic" data-fa="edit" aria-label="${edit ? '편집 끝내기' : '편집'}">${edit ? ICON_CHECK : ICON_PEN}</button>` : ''}<button class="fav-main fav-ic" data-fa="add" aria-label="추가">${ICON_PLUS}</button></div>`;
      };
      $('#mFav').onclick = () => {
        const pn = $('#mFavPanel'), open = pn.classList.toggle('hidden') === false;
        $('#mFav').classList.toggle('on', open);
        if (open) { favMode = 'list'; paintFav(); }
      };
      $('#mFavPanel').onclick = e => {
        const a = e.target.closest('[data-fa]');
        if (a) {
          const act = a.dataset.fa, list = favs();
          if (act === 'add') { favMode = 'form'; favIdx = -1; }
          else if (act === 'edit') favMode = favMode === 'edit' ? 'list' : 'edit';
          else if (act === 'cancel') favMode = favIdx >= 0 ? 'edit' : 'list';
          else if (act === 'del') { list.splice(favIdx, 1); saveSettings(); favMode = list.length ? 'edit' : 'list'; }
          else if (act === 'save') {
            const name = $('#mFavName').value.trim(), text = $('#mFavText').value.trim();
            if (!name) { toast('이름을 적어 주세요'); $('#mFavName').focus(); return; }

            saveSettings(); favMode = favIdx >= 0 ? 'edit' : 'list';
          }
          paintFav(); return;
        }
        const c = e.target.closest('[data-fav]'); if (!c) return;
        const i = +c.dataset.fav;
        if (favMode === 'edit') { favMode = 'form'; favIdx = i; paintFav(); return; }
        const ta = $('#mMemo'), v = favs()[i].text;
        ta.value = ta.value.trim() ? ta.value.trim() + '\n' + v : v; growMemo();
        toast(`'${favs()[i].name}' 넣었어요`);
      };
      const loadLunch = async lb => {
        if (lb.disabled) return;
        lb.disabled = true;
        try {
          const r = await call('getLunch', { date: m.date || S.date });
          if (!r.dishes.length) { toast('그날 급식 정보가 없어요'); return; }
          const line = r.dishes.join('\n');   // 메뉴만 한 줄에 하나씩
          const ta = $('#mMemo');
          ta.value = ta.value.trim() ? ta.value.trim() + '\n' + line : line; growMemo();
          const lunchTag = S.settings.tags.find(t => String(t.name).trim() === '본능식');   // 급식은 '본능식' 태그로
          if (lunchTag && sel.indexOf(lunchTag.id) < 0) { sel.push(lunchTag.id); paintTag(); }
          $('#mTime').value = '12:10';   // 급식 먹는 시간으로 맞춰요
        } catch(e){ fail(e); }
        finally { lb.disabled = false; }
      };
      // 메모가 칸을 넘칠 때만 칸(과 입력창)이 아래로 늘어나요. 화면 92%까지 크면 그 뒤로는 창 안에서 스크롤
      $('#mMemo').addEventListener('input', growMemo);
      growMemo();
      armDelete($('#mDelete'), async () => {
        S.day.meals = S.day.meals.filter(x => x.id !== m.id); renderToday(); cacheDay();
        send('deleteMeal', { id: m.id });
      });
    },
    async save(){
      const date = m.date || S.date, time = $('#mTime').value || nowTime();
      const memo = $('#mMemo').value.trim();
      if (!items.length && !memo) { toast('사진이나 메모 중 하나는 남겨 주세요'); return false; }
      // 새 사진은 임시 이름으로 먼저 화면에 보여줘요
      const localIds = items.map(it => { if (it.id) return it.id; const k = tmpId(); S.photos[k] = it.data; return k; });
      const mealId = m.id || 'm' + tmpId();   // 새 식사도 휴대폰에서 이름표를 정해 보내서, 다시 보내도 겹치지 않아요
      const local = { id: mealId, date, time, tag: m.tag, memo, photoId: localIds.join(',') };
      if (date === S.date) {
        S.day.meals = S.day.meals.filter(x => x.id !== local.id).concat(local).sort((a, b) => String(a.time).localeCompare(String(b.time)));
        renderToday(); cacheDay();
      }
      send('saveMeal', { id: mealId, date, time, tag: m.tag, memo, items });
      if (date !== S.date) { S.date = date; }
    }
  });
}

function stateChipsHtml(sel){
  const chips = S.settings.chips.slice();

  return chips.map(c => `<button class="chip${sel.has(c) ? ' on' : ''}" data-chip="${esc(c)}">${esc(showLabel(c))}</button>`).join('') + '<button class="chip add" id="sAdd">＋ 추가</button>';
}
function bindStateAdd(sel, paint, single){
  $('#sChips').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'sAdd') { $('#sAddRow').classList.remove('hidden'); $('#sNew').focus(); return; }
    const c = b.dataset.chip;
    if (single) { sel.clear(); sel.add(c); } else { sel.has(c) ? sel.delete(c) : sel.add(c); }
    paint();
  };
  $('#sNewOk').onclick = () => {
    const v = $('#sNew').value.trim().replace(/,/g, ' '); if (!v) return;
    if (S.settings.chips.indexOf(v) < 0) { S.settings.chips.push(v); saveSettings(); }
    if (single) sel.clear();
    sel.add(v); $('#sNew').value = ''; $('#sAddRow').classList.add('hidden'); paint();
  };
}
/* 상태 새로 입력: 고른 상태마다 기록이 하나씩 생겨요 (배변도 여러 번 입력 가능) */
function openStateSheet(){
  const sel = new Set();
  openSheet({
    title: '상태 입력',
    html: `
      <div class="group"><div class="group-label">상태</div><div class="chips" id="sChips"></div>
        <div class="add-row hidden" id="sAddRow"><input id="sNew" placeholder="새 상태 이름" maxlength="12"><button id="sNewOk">추가</button></div>

    mount(){

/* 기록 탭: 지난번 받아둔 달력을 바로 보여주고, 그 사이 서버에서 새로 받아 바꿔요 */
function monthCache(ym){ try { return JSON.parse(lsGet('md_month_' + ym) || 'null'); } catch(e){ return null; } }
const monthMem = {};   // 주별 평균에서 앞뒤 달 기록도 쓰려고 메모리에 보관
async function fetchMonth(ym){
  const r = await call('getMonth', { ym });
  monthMem[ym] = r;
  if (!DEMO) lsSet('md_month_' + ym, JSON.stringify(r));
  return r;
}
async function loadMonth(){
  const ym = S.ym;
  renderMonthTab(monthCache(ym));
  try { const r = await fetchMonth(ym); if (ym === S.ym && S.tab === 'cal') renderMonthTab(r); } catch(e){ fail(e); }
  // 앞뒤 달도 미리 받아둬서 넘길 때 바로 보이게
  const p = ym.split('-').map(Number);
  [-1, 1].forEach(k => { const d = new Date(p[0], p[1] - 1 + k, 1); const y2 = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    if (!monthCache(y2) && y2 <= todayStr().slice(0, 7)) fetchMonth(y2).catch(() => {}); });
}
function renderCal(data){
  if (data) S.calData = { ym: S.ym, data };
  else if (S.calData && S.calData.ym === S.ym) data = S.calData.data;
  const p = S.ym.split('-').map(Number), y = p[0], m = p[1];
  const days = new Date(y, m, 0).getDate();
  const ws = S.settings.weekStart === 'sun' ? 0 : 1;
  const wds = ws ? ['월','화','수','목','금','토','일'] : ['일','월','화','수','목','금','토'];
  const offset = (new Date(y, m-1, 1).getDay() - ws + 7) % 7;
  const today = todayStr();
  // 탭: 전체 | 사이즈 | 체성분 | 운동  (예전 '신체' 탭은 사이즈로, '상태'는 전체로, '걸음'은 운동으로)
  const raw = { step: 'ex', state: 'all', body: 'size' }[S.calTab] || S.calTab || 'all';
  const ctab = ['all', 'size', 'comp', 'ex'].indexOf(raw) >= 0 ? raw : 'all';
  const tab = ctab === 'size' || ctab === 'comp' ? 'body' : ctab;
  // [이름, 단위, 달력에 붙는 글자]
  const BODY = { weight: ['체중', 'kg', '체'], waist1: ['허리1', 'cm', '1'], waist2: ['허리2', 'cm', '2'],
                 bodyFat: ['체지방', '%', '체'], muscle: ['골격근', 'kg', '골'], bmi: ['BMI', '', 'b'] };
  const GROUPS = { wt: ['사이즈', ['weight', 'waist1', 'waist2']], comp: ['체성분', ['bodyFat', 'muscle', 'bmi']] };
  const bg = ctab === 'comp' ? 'comp' : 'wt', bms = GROUPS[bg][1];
  // 탭별로 날짜 아래에 보여줄 내용
  const detail = info => {
    if (tab === 'state') {
      const cnt = {}; (info.labels || []).forEach(l => cnt[l] = (cnt[l] || 0) + 1);
      const ls = Object.keys(cnt);
      return ls.map(l => {
        const n = cnt[l] > 1 ? `<b class="cnt">${cnt[l]}</b>` : '';
        if (isToilet(l)) { const ic = toiletIcon(l); return `<span class="cv ${ic === '👎' ? 'cvn' : 'cvg'}">${esc(showLabel(l))}${n}</span>`; }
        return `<span class="cv cvt">${esc(l)}${n}</span>`;
      }).join('');
    }
    if (tab === 'body') {
      // 체성분은 그날 하나라도 기록이 있으면 빠진 항목을 '-'로 보여줘요 (나중에 채워 넣을 수 있게)
      const any = bms.some(k => has(info[k]));
      if (!any) return '';
      // 사이즈: 허리를 하나도 안 잰 날은 허리 줄을 아예 빼요 (체중만)
      const show = bg === 'wt' && !has(info.waist1) && !has(info.waist2) ? bms.filter(k => k === 'weight') : bms;
      return show.map(k => has(info[k])   // 사이즈·체성분 모두: 항목 자리 고정, 안 잰 항목은 '-'

        ? `<span class="bv mono"><i>${BODY[k][2]}</i>${(+info[k]).toFixed(1)}${BODY[k][1] ? `<small>${BODY[k][1]}</small>` : ''}</span>`
        : `<span class="bv na"><i>${BODY[k][2]}</i>-</span>`).join('');
    }
    if (tab === 'ex') {
      // 운동(소모 칼로리) + 걸음을 한 칸에: 💪 299kcal / 👟 7085보
      const ws = info.workouts || [], kcal = ws.reduce((a, w) => a + (+w.kcal || 0), 0), st = +info.steps || 0;
      let h = '';
      if (!ws.length && st > 0) h += '<span class="bv bx">&nbsp;</span>';   // 운동 안 한 날: 첫 줄은 비워 두고 걸음은 둘째 줄 그대로
      if (ws.length) h += kcal ? `<span class="bv bx mono${kcal >= 1000 ? ' tight' : ''}"><i>💪</i>${kcal}<small>kcal</small></span>` : `<span class="bv bx na"><i>💪</i>-</span>`;
      if (st > 0) h += `<span class="bv bx mono${st >= 10000 ? ' tight' : ''}"><i>👟</i>${st}<small>보</small></span>`;
      return h;
    }
    return '';
  };
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(m)}-${pad(d)}`, info = (data && data[ds]) || {};
    // 색 점: 갈색 = 배변 좋음(👍), 빨강 = 배변 나쁨(👎) / 운동한 날은 날짜 오른쪽 위에 작게 💪
    const tl = info.toilet || [];
    // 점수는 칸 배경색(최고 하늘 · 보통 연노랑 · 아쉬움 연분홍), 날짜 옆엔 ‼️(술), 같은 줄 오른쪽 끝에 💪 / 아래 줄: 배변 하트
    const dots = (tl.some(t => t !== '👎') ? '<i>🩵</i>' : '') + (tl.indexOf('👎') >= 0 ? '<i>🩶</i>' : '');
    const exHtml = (+info.drink ? `<span class="cex">${DRINK_CAL}</span>` : '') + ((info.workouts || []).length ? '<span class="cmus">💪</span>' : '');
    const scoreCls = tab === 'all' && SCORES[info.score] ? ' sc' + info.score : '';
    const wd = new Date(y, m - 1, d).getDay();
    const inner = tab === 'all'
      ? `<span class="dn">${d}${exHtml}</span><span class="cdots">${dots}</span>${has(info.weight) ? `<span class="bv mono">${(+info.weight).toFixed(1)}<small>kg</small></span>` : '<span class="bv">&nbsp;</span>'}${has(info.waist1) || has(info.waist2) ? `<span class="bv mono">${has(info.waist1) ? (+info.waist1).toFixed(1) : '-'}/${has(info.waist2) ? (+info.waist2).toFixed(1) : '-'}</span>` : ''}`
      : `<span class="dn">${d}</span>${detail(info)}`;
    cells += `<button class="cell${ds === today ? ' today' : ''}${ds > today ? ' future' : ''}${wd === 0 ? ' sun' : wd === 6 ? ' sat' : ''}${scoreCls}" data-date="${ds}">${inner}</button>`;
  }
  // 달력 아래 한 줄 요약
  const keys = data ? Object.keys(data).filter(k => k.indexOf(S.ym) === 0).sort() : [];
  let below = '';
  if (!data) below = '<div class="chart"><p class="empty" style="text-align:center">불러오는 중…</p></div>';
  else if (tab === 'all') {
    // 왼쪽: 운동한 날 / 오른쪽: 점수별 날 수 (칸 배경색과 같은 색)
    let exDays = 0; const sc = { 3: 0, 2: 0, 1: 0 };
    keys.forEach(k => { if ((data[k].workouts || []).length) exDays++; if (sc[data[k].score] != null) sc[data[k].score]++; });
    below = `<div class="sum-row">
      <div class="sum-box grow"><span class="sum-t">이번 달 점수</span><div class="sum-sc">${[3, 2, 1].map(k => `<span class="sc${k}">${SCORES[k].e} <b>${sc[k]}</b>일</span>`).join('')}</div></div>
      <div class="sum-box"><span class="sum-t">이번 달 운동</span><b>💪 ${exDays}일</b></div>
    </div>`;
  }
  else if (tab === 'state') {
    let good = 0, bad = 0; const cnt = {};
    keys.forEach(k => [...new Set(data[k].labels || [])].forEach(l => {
      if (isToilet(l)) { if (toiletIcon(l) === '👎') bad++; else good++; } else cnt[l] = (cnt[l] || 0) + 1;
    }));
    const lines = [['🩵 좋음', good], ['🩶 나쁨', bad]].concat(Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).map(l => [esc(l), cnt[l]]));
    below = `<div class="chart" style="padding:8px 16px">${lines.map(([n, c]) => `<div class="st-row"><span>${n}</span><b>${c}일</b></div>`).join('')}</div>`;
  } else if (tab === 'body') below = weeklyBodyHtml(data, y, m, ws, bms, BODY); else if (tab === 'ex') {
    let kc = 0, exDays = 0; keys.forEach(k => { const w = data[k].workouts || []; if (w.length) exDays++; w.forEach(x => kc += +x.kcal || 0); });
    const vs = keys.filter(k => +data[k].steps > 0).map(k => +data[k].steps);

  }

    <div class="cal">${wds.map(w => `<div class="wd${w === '일' ? ' sun' : w === '토' ? ' sat' : ''}">${w}</div>`).join('')}</div>

/* 신체 탭 아래: 주별 평균 + 전주 대비 변화 (앞뒤 달 기록도 함께 써요) */
/* 인바디 CSV → 날짜별 { weight, bodyFat, bmi, muscle } */
function parseInBody(text){
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const head = lines[0].split(',').map(h => h.trim());
  const col = name => head.findIndex(h => h.indexOf(name) === 0);
  const ci = { date: col('날짜'), weight: col('체중'), muscle: col('골격근량'), bmi: col('BMI'), bodyFat: col('체지방률') };
  if (ci.date < 0 || ci.weight < 0) throw new Error('인바디 CSV 형식이 아니에요');
  const byDate = {};
  lines.slice(1).forEach(l => {
    const c = l.split(',').map(v => v.trim());
    const raw = (c[ci.date] || '').replace(/\D/g, '');
    if (raw.length < 8) return;
    const date = raw.slice(0, 4) + '-' + raw.slice(4, 6) + '-' + raw.slice(6, 8);
    const time = raw.length >= 12 ? raw.slice(8, 10) + ':' + raw.slice(10, 12) : '';
    const v = k => { const x = ci[k] >= 0 ? c[ci[k]] : ''; return x && x !== '-' && !isNaN(+x) ? String(+x) : ''; };
    const row = { date, time, weight: v('weight'), bodyFat: v('bodyFat'), bmi: v('bmi'), muscle: v('muscle') };
    if (!byDate[date] || (time && time < byDate[date].time)) byDate[date] = row;   // 하루 중 가장 이른 측정
  });
  return Object.keys(byDate).sort().map(d => byDate[d]);
}
// 한꺼번에 넣은 뒤: 휴대폰에 저장해 둔 달력·하루 기록을 비워서 새로 받아오게
function clearDataCaches(){
  try { Object.keys(localStorage).forEach(k => { if (/^md_(month|day)_/.test(k)) localStorage.removeItem(k); }); } catch(err){}
  Object.keys(monthMem).forEach(k => delete monthMem[k]); S.calData = null; S.chgAll = null;
  Object.keys(fetchedRanges).forEach(k => delete fetchedRanges[k]);
}
async function onInBodyPicked(e){
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const rows = parseInBody(await f.text());
    if (!rows.length) { toast('가져올 기록이 없어요'); return; }
    toast(`${rows.length}일치 인바디 기록을 넣는 중…`);
    const r = await call('importBody', { rows });
    clearDataCaches();
    toast(`인바디 기록 ${r.added + r.updated}일치를 넣었어요 (새로 ${r.added} · 바뀜 ${r.updated})`);
  } catch(err){ fail(err); }
}
function weeklyBodyHtml(data, y, m, ws, bms, BODY){
  const all = {};
  const p = new Date(y, m - 2, 1), n = new Date(y, m, 1);
  [p.getFullYear() + '-' + pad(p.getMonth() + 1), n.getFullYear() + '-' + pad(n.getMonth() + 1)]
    .forEach(ym => Object.assign(all, monthMem[ym] || monthCache(ym) || {}));
  Object.assign(all, data);
  // 이번 달 1일이 들어있는 주부터 말일이 들어있는 주까지 + 비교용으로 그 앞 주 하나

function chgWeekly(pts){

// 아래 날짜: 기간에 맞춰 5~6개, 겹치지 않게
function chgXLabels(from, to, X, H){

function chgCard(k, pts, from, to){

    }

    ${pts.length >= 2 ? (S.chg.view === 'raw' ? '<div class="chg-legend"><span><i class="ln thin"></i>잰 값 그대로</span></div>' : '<div class="chg-legend"><span><i class="dot"></i>날마다 잰 값</span><span><i class="ln"></i>주별 평균</span></div>') : ''}</div>`;

function chgActivity(all, days, from, to){

    const md = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;

    const step = Math.max(1, Math.ceil(ws.length / 5));

// 그래프를 누르거나 밀면 가장 가까운 날의 값 보여주기
function chgScrub(e){
  const svg = e.target.closest('.chg-svg'); if (!svg) return;
  const c = chgPoints[svg.dataset.ck]; if (!c) return;
  const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * c.W;
  let best = null, bd = 1e9; c.pts.forEach(p => { const dd = Math.abs(c.X(p.d) - x); if (dd < bd) { bd = dd; best = p; } });
  if (!best) return;

function chartSvg(data, days){
  const keys = Object.keys(data).sort();
  const series = k => keys.filter(d => has(data[d][k])).map(d => ({ x: +d.slice(8,10), v: +data[d][k] }));
  const sets = [{ n:'체중', k:'weight', c:'#111' }, { n:'골격근량', k:'muscle', c:'#B88A5A' }]
    .map(s => Object.assign(s, { p: series(s.k) })).filter(s => s.p.length >= 2);
  if (!sets.length) return '<p class="empty" style="text-align:center">기록이 2개 이상 쌓이면 그래프가 보여요.</p>';
  const W = 340, H = 170, L = 10, R = 48, T = 14, B = 26;
  const X = x => L + (x - 1) / Math.max(days - 1, 1) * (W - L - R);
  let out = '';
  sets.forEach(s => {
    const vs = s.p.map(q => q.v); let mn = Math.min(...vs), mx = Math.max(...vs);
    if (mx - mn < 1) { const c = (mx + mn) / 2; mn = c - .5; mx = c + .5; }
    const Y = v => T + (mx - v) / (mx - mn) * (H - T - B);
    out += `<polyline points="${s.p.map(q => X(q.x).toFixed(1) + ',' + Y(q.v).toFixed(1)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    out += s.p.map(q => `<circle cx="${X(q.x).toFixed(1)}" cy="${Y(q.v).toFixed(1)}" r="3" fill="${s.c}"/>`).join('');
    const last = s.p[s.p.length - 1];
    out += `<text x="${(X(last.x) + 6).toFixed(1)}" y="${(Y(last.v) + 4).toFixed(1)}" font-size="11" fill="${s.c}" font-family="Pretendard,sans-serif">${last.v.toFixed(1)}</text>`;
  });
  out += [1, Math.ceil(days / 2), days].map(d => `<text x="${X(d).toFixed(1)}" y="${H - 6}" font-size="10" fill="#9a9a9e" text-anchor="middle">${d}일</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}">${out}</svg><div class="legend" style="margin-top:4px">${sets.map(s => `<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`;
}
