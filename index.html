/* 끌어서 순서 바꾸기: ≡ 를 누른 채 위아래로 */
function makeSortable(list, onEnd){
  list.addEventListener('pointerdown', e => {
    const h = e.target.closest('.drag'); if (!h) return;
    const row = h.closest('.order-row'); if (!row) return;
    e.preventDefault();
    row.classList.add('dragging');
    const start = [...list.querySelectorAll('.order-row')].map(r => r.dataset.i).join();
    const move = ev => {
      const others = [...list.querySelectorAll('.order-row')].filter(r => r !== row);
      let idx = others.findIndex(r => { const b = r.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
      if (idx < 0) list.appendChild(row); else list.insertBefore(row, others[idx]);
    };
    const end = () => {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', end); document.removeEventListener('pointercancel', end);
      row.classList.remove('dragging');
      const order = [...list.querySelectorAll('.order-row')].map(r => +r.dataset.i);
      if (order.join() !== start) onEnd(order);
    };
    // 줄을 옮기는 동안에도 손가락을 놓칠 않도록 문서 전체에서 추적
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  });
}
function bindSortables(){
  document.querySelectorAll('#view-set .sortable').forEach(list => makeSortable(list, order => {
    const key = list.dataset.kind, old = S.settings[key];
    S.settings[key] = order.map(i => old[i]);
    saveSettings().catch(fail);
  }));
}

function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function wrap(ctx, text, maxW){
  const out = []; let line = '';

    const t = line + ch;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch.trim() ? ch : ''; }
    else line = t;
  }
  out.push(line); return out;
}

async function drawExport(dayArg){

    }
    const bl = [l1.join('  ·  '), l2.join('  ·  ')].filter(Boolean);
    if (bl.length) info.push(['신체', bl.join('\n')]);
  }
  if (S.exOpt.act) {
    // 걸음 → 총 칼로리 → 운동마다 한 줄씩 (운동은 안쪽으로 들여서)
    const act = [], ws = d.workouts || [];
    if (d.activity && has(d.activity.steps)) act.push(`👟 ${Number(d.activity.steps).toLocaleString('ko-KR')}걸음`);
    const kcalSum = ws.reduce((x, w) => x + (+w.kcal || 0), 0);
    if (ws.length) act.push(`🔥 총 ${kcalSum ? kcalSum.toLocaleString('ko-KR') + 'kcal' : '-'}`);   // 운동이 있으면 총 줄은 늘 (칼로리 안 넣었으면 -)
    ws.forEach(w => act.push('\t' + workoutIcon(w.name) + ' ' + w.name + ' ' + [has(w.kcal) ? w.kcal + 'kcal' : '', has(w.minutes) ? w.minutes + '분' : ''].filter(Boolean).join(' · ')));

  const c = document.createElement('canvas'); c.width = W; c.height = 400;
  const ctx = c.getContext('2d');

  const run = draw => {

    ctx.font = `700 46px ${F}`; ctx.fillStyle = '#111';
    if (draw) ctx.fillText(longDate(d.date) + (scoreIcons(dayScore(d), dayDrink(d)) ? '  ' + scoreIcons(dayScore(d), dayDrink(d)) : ''), P, y);

        return a.concat(wrap(ctx, t, valW - (ind ? IND : 0)).map(x => ({ t: x, ind })));
      }, []) }));
      const boxH = 32 + rows.reduce((a, r) => a + r.ls.length * 46, 0) + (rows.length - 1) * 18 + 26;
      if (draw) {
        ctx.fillStyle = '#F6F5F2'; rr(ctx, P, y, W - 2 * P, boxH, 32); ctx.fill();
        let yy = y + 32;
        rows.forEach(r => {
          ctx.font = `700 30px ${F}`; ctx.fillStyle = '#8e8e93'; ctx.fillText(r.k, P + 28, yy + 2);
          ctx.font = `400 32px ${F}`; ctx.fillStyle = '#222';

          yy += r.ls.length * 46 + 18;

    }

    const SZ = 540, SH = 430;   // 공유 이미지 사진 칸: 가로 540 × 세로 430
    const coverRect = (im, x, yy, w, h) => {
      ctx.save(); ctx.beginPath(); ctx.rect(x, yy, w, h); ctx.clip();
      const k = Math.max(w / im.width, h / im.height), iw = im.width * k, ih = im.height * k;

      ctx.restore();
    };
    // 사진 칸(SZ×SZ) 하나 안에 여러 장을 나눠 그리기 — 앱 화면과 같은 배치
    const drawPhotos = (ims, x, yy, s, sh, r) => {
      ctx.save(); rr(ctx, x, yy, s, sh, r); ctx.clip();
      ctx.fillStyle = '#fff'; ctx.fillRect(x, yy, s, sh);
      const g = 6, w = (s - g) / 2, h = (sh - g) / 2;
      const n = Math.min(ims.length, 4);
      let cells;
      if (n === 1) cells = [[x, yy, s, sh]];
      else if (n === 2) cells = [[x, yy, w, sh], [x + w + g, yy, w, sh]];
      else if (n === 3) cells = [[x, yy, w, sh], [x + w + g, yy, w, h], [x + w + g, yy + h + g, w, h]];
      else cells = [[x, yy, w, h], [x + w + g, yy, w, h], [x, yy + h + g, w, h], [x + w + g, yy + h + g, w, h]];
      cells.forEach((c, i) => coverRect(ims[i], c[0], c[1], c[2], c[3]));
      if (ims.length > 4) {
        const c = cells[3];
        ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(c[0], c[1], c[2], c[3]);
        ctx.fillStyle = '#fff'; ctx.font = `700 44px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('+' + (ims.length - 4), c[0] + c[2] / 2, c[1] + c[3] / 2);
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      }
      ctx.restore();
    };
    const drawText = (m, ts, x2, yy, memo) => {
      let px = x2;
      ts.forEach(t => {
        ctx.font = `700 32px ${F}`;
        const label = ts.length >= 3 ? t.emoji : `${t.emoji} ${t.name}`, pw = ctx.measureText(label).width + 52;   // 태그 3개 이상이면 이모지만
        ctx.fillStyle = t.color; rr(ctx, px, yy + 6, pw, 60, 30); ctx.fill();
        ctx.fillStyle = '#222'; ctx.textBaseline = 'middle'; ctx.fillText(label, px + 26, yy + 37); ctx.textBaseline = 'top';
        px += pw + 12;
      });
      ctx.font = `700 40px ${F}`; ctx.fillStyle = '#111'; ctx.fillText(korTime(m.time), x2, yy + 86);
      ctx.font = `400 32px ${F}`; ctx.fillStyle = '#8a8a8e';
      memo.forEach((l, i) => ctx.fillText(l, x2, yy + 86 + 48 + 16 + i * 46));
    };
    meals.forEach(m => {
      const ts = tagsOf(m.tag), t = ts[0] || NO_TAG, ims = imgs[m.id] || [];
      const x2 = P + SZ + 44, w2 = W - P - x2;
      ctx.font = `400 32px ${F}`;
      const memo = m.memo ? m.memo.split('\n').reduce((a, s) => a.concat(wrap(ctx, s, w2)), []) : [];
      const rowH = Math.max(SH, 86 + 48 + (memo.length ? 16 + memo.length * 46 : 0));
      if (draw) {
        if (ims.length) drawPhotos(ims, P, y, SZ, SH, 40);
        else {
          ctx.save(); rr(ctx, P, y, SZ, SH, 40); ctx.clip();
          ctx.fillStyle = '#F2F1EE'; ctx.fillRect(P, y, SZ, SH);
          ctx.font = `110px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(t.emoji, P + SZ / 2, y + SH / 2 + 6);
          ctx.textAlign = 'left'; ctx.textBaseline = 'top';
          ctx.restore();
        }
        drawText(m, ts, x2, y, memo);
      }
      y += rowH + 40;
    });

    if (S.exOpt.diary && d.diary) {
      ctx.font = `400 32px ${F}`;
      const ls = d.diary.split('\n').reduce((a, s) => a.concat(wrap(ctx, s, W - 2 * P - 56)), []);
      const h = 30 + 36 + 16 + ls.length * 46 + 26;
      if (draw) {
        ctx.fillStyle = '#F6F5F2'; rr(ctx, P, y, W - 2 * P, h, 32); ctx.fill();
        ctx.font = `700 30px ${F}`; ctx.fillStyle = '#8e8e93'; ctx.fillText('일기', P + 28, y + 30);
        ctx.font = `400 32px ${F}`; ctx.fillStyle = '#222';
        ls.forEach((l, i) => ctx.fillText(l, P + 28, y + 30 + 52 + i * 46));
      }
      y += h + 40;
    }
    return y - 40 + P;
  };

  c.height = Math.max(run(false), 400);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, c.height);
  run(true);
  const url = c.toDataURL('image/jpeg', 0.92);
  if (dayArg) return url;   // 일주일 모드: 그날 이미지만 돌려줘요
  S.exUrl = url;
  $('#exImg').src = S.exUrl;
  $('#exMsg').textContent = '공유 버튼이 안 되면 이미지를 길게 눌러 저장하거나 공유하세요.';
}

/* 일주일 공유: 그 주에 기록이 있는 날마다 하루 이미지를 만들어 한꺼번에 공유 */
function weekStartOf(date){
  const ws = S.settings.weekStart === 'sun' ? 0 : 1, p = date.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2]);
  return addDays(date, -((d.getDay() - ws + 7) % 7));
}
function exWeekLabel(){
  const a = S.exWeek, b = addDays(a, 6), md = x => `${+x.slice(5, 7)}/${+x.slice(8, 10)}`;
  $('#exWeekLbl').textContent = `${md(a)} ~ ${md(b)}`;
}
let weekJob = 0;
async function drawWeek(){
  const job = ++weekJob, from = S.exWeek, to = addDays(from, 6);
  exWeekLabel();
  S.exWeekUrls = []; S.exWeekReady = false;
  // 월~일 자리를 먼저 만들어 두고, 준비된 날부터 제자리에 넣어요 (순서가 섞이지 않게)
  const dates = []; for (let d = from; d <= to; d = addDays(d, 1)) dates.push(d);
  $('#exWeek').innerHTML = dates.map(d => `<div class="wk-slot hidden" data-wd="${d}"></div>`).join('');
  const blank = d => ({ date: d, meals: [], states: [], body: null, activity: null, workouts: [], diary: '' });
  const hasRec = d => d && ((d.meals || []).length || (d.states || []).length || d.body || (d.workouts || []).length || d.diary || (d.activity && (+d.activity.steps || +d.activity.water)));
  const cur = {}, urls = {}, drawn = {}, busy = {};
  let serverDone = false;
  // B: 휴대폰 저장본으로 먼저
  dates.forEach(d => { try { const c = JSON.parse(lsGet('md_day_' + d) || 'null'); if (c) cur[d] = c; } catch(e){} });
  if (S.day && S.day.date >= from && S.day.date <= to) cur[S.day.date] = S.day;

  const status = () => {
    if (job !== weekJob) return;
    const ds = dates.filter(d => hasRec(cur[d])), n = ds.filter(d => urls[d] && drawn[d] === JSON.stringify(cur[d])).length;
    if (serverDone && !ds.length) { $('#exMsg').textContent = '이 주에는 기록이 없어요.'; S.exWeekUrls = []; return; }
    if (!serverDone || n < ds.length) {
      S.exWeekReady = false;
      $('#exMsg').textContent = ds.length ? `준비 중 ${n}/${ds.length} · 다 되면 공유할 수 있어요` : '일주일 이미지를 만드는 중…';
      return;
    }
    S.exWeekReady = true;
    S.exWeekUrls = ds.map(d => ({ date: d, url: urls[d] }));
    $('#exMsg').textContent = `기록이 있는 ${ds.length}일 · 이미지 ${ds.length}장 · 공유를 누르면 한꺼번에 보내져요.`;
  };
  // 그리기는 한 장씩 차례로 (휴대폰 메모리 아끼기), 사진 받기는 날마다 동시에
  let drawChain = Promise.resolve();
  const render = d => {
    const k = JSON.stringify(cur[d] || null);
    if (busy[d] && busy[d].k === k) return busy[d].p;   // 같은 내용을 이미 그리는 중이면 그걸 기다려요
    const p = render_(d); busy[d] = { k, p };
    return p;
  };
  const render_ = async d => {
    const day = cur[d], slot = $(`#exWeek [data-wd="${d}"]`);
    if (!slot) return;
    if (!hasRec(day)) { slot.classList.add('hidden'); slot.innerHTML = ''; delete urls[d]; delete drawn[d]; status(); return; }
    const key = JSON.stringify(day);
    if (drawn[d] === key) { status(); return; }
    await loadPhotos(day.meals || []);   // C: 이 날 사진만 준비되면 바로 그려요
    if (job !== weekJob || cur[d] !== day) return;
    const p = drawChain.then(async () => {
      if (job !== weekJob || cur[d] !== day) return;
      const url = await drawExport(Object.assign(blank(d), day));
      if (job !== weekJob || cur[d] !== day) return;
      urls[d] = url; drawn[d] = key;
      slot.innerHTML = `<p class="wk-day">${esc(korDate(d))}</p><img src="${url}" alt="">`;
      slot.classList.remove('hidden');
      status();
    });
    drawChain = p.catch(() => {});
    await p;
  };
  status();
  const first = Promise.all(dates.map(d => cur[d] ? render(d) : null));
  // 서버의 최신 기록을 받아서, 바뀐 날만 다시 그려요
  try {
    const r = await call('getRange', { from, to });
    if (job !== weekJob) return;
    dates.forEach(d => {
      if (S.day && S.day.date === d && qLoad().length) return;   // 아직 보내는 중인 오늘 기록은 휴대폰 것을 써요
      const nd = r.days && r.days[d] ? Object.assign(blank(d), r.days[d]) : null;
      if (JSON.stringify(nd) !== JSON.stringify(cur[d] ? Object.assign(blank(d), cur[d]) : null)) cur[d] = nd;
    });
  } catch(e){}
  if (job !== weekJob) return;
  serverDone = true;
  await Promise.all(dates.map(render));
  await first;
  status();
}
/* 공유 화면에서 하루씩 이동: 휴대폰 저장본을 바로 쓰고 없으면 서버에서 받아요 */
let exDayJob = 0;
async function exGoDay(delta){
  const job = ++exDayJob, date = addDays((S.exDay || S.day).date, delta);
  $('#exDayLbl').textContent = korDate(date);
  $('#exImg').removeAttribute('src'); S.exUrl = '';
  $('#exMsg').textContent = '이미지를 만드는 중…';
  const empty = { date, meals: [], states: [], body: null, activity: null, workouts: [], diary: '' };
  let day = S.day && S.day.date === date ? S.day : null;
  if (!day) { try { day = JSON.parse(lsGet('md_day_' + date) || 'null'); } catch(e){} }
  if (!day) {
    try { day = Object.assign(empty, await call('getDay', { date })); if (!DEMO) lsSet('md_day_' + date, JSON.stringify(day)); }
    catch(e){ if (job === exDayJob) $('#exMsg').textContent = '그날 기록을 불러오지 못했어요.'; return; }
  }
  if (job !== exDayJob) return;

  await drawExport();
}
function setExMode(mode){
  S.exMode = mode;
  document.querySelectorAll('.ex-mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('#exWeekNav').classList.toggle('hidden', mode !== 'week');

  $('#exImg').classList.toggle('hidden', mode === 'week');
  $('#exWeek').classList.toggle('hidden', mode !== 'week');

  else drawExport();
}
async function shareExport(){
  if (S.exMode === 'week') {
    if (!S.exWeekReady) { toast('이미지를 다 만들면 공유할 수 있어요'); return; }
    const list = S.exWeekUrls || []; if (!list.length) return;
    try {
      const files = await Promise.all(list.map(async x => new File([await (await fetch(x.url)).blob()], `mealday_${x.date}.jpg`, { type: 'image/jpeg' })));
      if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files }); return; }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    toast('이미지를 하나씩 길게 눌러 저장·공유해 주세요');
    return;
  }
  if (!S.exUrl) return;
  try {
    const blob = await (await fetch(S.exUrl)).blob();
    const file = new File([blob], `mealday_${(S.exDay || S.day).date}.jpg`, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  toast('이미지를 길게 눌러 저장·공유해 주세요');
}

/* ───── 검색: 식사 메모 · 일기에서 키워드 찾기 ───── */
// 띄어 쓴 낱말 중 하나라도 들어간 기록을 모두 찾아요 (예: '닭 샐러드' → 닭 또는 샐러드)
const srchWords = q => String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
function srchHl(text, ws, snip){
  let t = String(text || '');
  const low = t.toLowerCase();
  if (snip && t.length > 120) {   // 긴 일기는 처음 찾은 곳 앞뒤만 잘라서
    const i = Math.max(0, ws.reduce((a, w) => { const k = low.indexOf(w); return k >= 0 && (a < 0 || k < a) ? k : a; }, -1));
    const a = Math.max(0, i - 35), b = Math.min(t.length, a + 120);
    return (a > 0 ? '…' : '') + srchHl(t.slice(a, b), ws) + (b < t.length ? '…' : '');
  }
  // 찾은 구간을 표시 (겹치는 구간은 합쳐요)
  const rs = [];
  ws.forEach(w => { let k = 0; while ((k = low.indexOf(w, k)) >= 0) { rs.push([k, k + w.length]); k += w.length; } });
  rs.sort((x, y) => x[0] - y[0]);
  let out = '', pos = 0;
  rs.forEach(([a, b]) => { if (b <= pos) return; a = Math.max(a, pos); out += esc(t.slice(pos, a)) + '<mark>' + esc(t.slice(a, b)) + '</mark>'; pos = b; });
  return out + esc(t.slice(pos));
}
function renderSrch(){
  const v = $('#view-srch');
  if (!$('#srchForm')) {
    v.innerHTML = `<form id="srchForm" class="srch-bar" autocomplete="off"><input id="srchQ" type="search" enterkeyhint="search" placeholder="식사 메모 · 일기에서 찾기"><button type="submit">검색</button></form><div id="srchRes"></div>`;
    $('#srchForm').onsubmit = e => { e.preventDefault(); $('#srchQ').blur(); doSearch($('#srchQ').value); };
    $('#srchRes').onclick = e => { const b = e.target.closest('[data-date]'); if (b) { S.date = b.dataset.date; setTab('today'); } };
    if (S.srch) $('#srchQ').value = S.srch.q;
  }
  paintSrch();
}
function paintSrch(){
  const box = $('#srchRes'); if (!box) return;
  const st = S.srch;
  if (!st) { box.innerHTML = '<p class="srch-hint">식사 메모와 일기에서 키워드가 들어간 기록을 찾아요.<br>여러 낱말을 띄어 쓰면 하나라도 들어간 기록을 모두 찾아요.</p>'; return; }
  if (st.loading) { box.innerHTML = '<p class="srch-sum">찾는 중…</p>'; return; }
  if (st.err) { box.innerHTML = `<p class="srch-hint">${esc(st.err)}</p>`; return; }
  const ws = srchWords(st.q), r = st.res || { meals: [], diary: [] };
  const days = {};
  (r.meals || []).forEach(m => (days[m.date] = days[m.date] || { m: [], d: '' }).m.push(m));
  (r.diary || []).forEach(x => (days[x.date] = days[x.date] || { m: [], d: '' }).d = x.text);
  const ds = Object.keys(days).sort().reverse();
  const nm = (r.meals || []).length, nd = (r.diary || []).length;
  if (!ds.length) { box.innerHTML = `<p class="srch-sum">'${esc(st.q)}' 찾은 기록이 없어요</p>`; return; }
  box.innerHTML = `<p class="srch-sum">${ds.length}일 · 식사 ${nm}개 · 일기 ${nd}개</p>` + ds.map(d => {
    const x = days[d], y = d.slice(0, 4);
    const meals = x.m.sort((a, b) => String(a.time).localeCompare(String(b.time))).map(m => {
      const t = getTag(m.tag);
      return `<div class="sr-it"><div class="sr-meta"><span class="sr-tag" style="background:${t.color}">${t.emoji} ${esc(t.name)}</span>${m.time ? korTime(m.time) : ''}</div><div class="sr-txt">${srchHl(m.memo, ws)}</div></div>`;
    }).join('');
    const diary = x.d ? `<div class="sr-it"><div class="sr-meta"><span class="sr-tag">📔 일기</span></div><div class="sr-txt">${srchHl(x.d, ws, true)}</div></div>` : '';
    return `<button class="sr-day" data-date="${d}"><div class="sr-date">${korDate(d)}${y !== todayStr().slice(0, 4) ? `<small>${y}년</small>` : ''}</div>${meals}${diary}</button>`;
  }).join('');
}
async function doSearch(q){
  q = String(q || '').trim();
  if (!q) { S.srch = null; paintSrch(); return; }
  const my = S.srch = { q, loading: true };
  paintSrch();
  try {
    const res = await call('search', { q });
    if (S.srch !== my) return;
    my.loading = false; my.res = res;
  } catch(e){
    if (S.srch !== my) return;
    const msg = String((e && e.message) || e);
    my.loading = false;
    my.err = /알 수 없는 요청/.test(msg) ? 'Apps Script에 아직 예전 코드가 배포되어 있어요. 새 Code.gs로 바꾸고 새 버전으로 배포하면 검색돼요.' : '검색하지 못했어요: ' + msg;
  }
  if (S.tab === 'srch') paintSrch();
}

/* ───── 화면 전환 / 이벤트 ───── */
function setTab(tab){

        if (e.target.closest('.thumb') && m && photoIds(m).length) { openPhotoViewer(photoIds(m)); break; }
        openMealSheet(m); break;
      }
      case 'diary': openDiarySheet(); break;
      case 'meal-new': openMealSheet(); break;
      case 'water': openWaterSheet(); break;
    }
  });

  $('#view-cal').addEventListener('click', e => {
    const ct = e.target.closest('[data-ctab]');

    const cb = e.target.closest('[data-cbody]');
    if (cb) { S.calBody = cb.dataset.cbody; renderCal(monthCache(S.ym)); return; }
    const cell = e.target.closest('[data-date]');
    if (cell) { S.date = cell.dataset.date; setTab('today'); return; }

    S.ym = nd.getFullYear() + '-' + pad(nd.getMonth() + 1);
    loadMonth();
  });

  $('#countBtn').onclick = openCount;
  $('#sheetBody').addEventListener('click', e => {
    if (!$('#cntBox')) return;
    if (e.target.closest('#cntPad')) { cntTap(true); return; }
    if (e.target.closest('#cntUndo')) { cntTap(false); return; }
    if (e.target.closest('#cntReset')) { cntSave({ list: [] }); renderCnt(); return; }
  });
  $('#view-chg').addEventListener('click', e => {
    const cp = e.target.closest('[data-cp]'); if (cp) {
      S.chg.span = CHG_PERIODS.find(x => x[0] === cp.dataset.cp)[2] || null;
      S.chg.view = cp.dataset.cp === '1m' ? 'raw' : 'trend';   // 1달은 실제 값, 나머지는 흐름이 기본
      drawChg(); return;
    }
    const cg = e.target.closest('[data-cg]'); if (cg) { S.chg.group = cg.dataset.cg; drawChg(); return; }
    const cv = e.target.closest('[data-cv]'); if (cv) { S.chg.view = cv.dataset.cv; drawChg(); return; }
    if (e.target.closest('#chgSet')) openChgSettings();
  });
  // 두 손가락으로 벌리면 최근 쪽으로 확대(기간이 짧아지고), 오므리면 기록 전체까지 넓어져요
  const pinch = new Map(); let pz = null, pzRaf = 0;
  const vc = $('#view-chg');
  vc.addEventListener('pointerdown', e => {
    if (!e.target.closest('.chg-card')) return;
    pinch.set(e.pointerId, e.clientX);
    if (pinch.size === 2) {
      const xs = [...pinch.values()], rg = chgRange();
      pz = { d: Math.abs(xs[0] - xs[1]) || 1, span: S.chg.span || rg.total, total: rg.total };
      try { [...pinch.keys()].forEach(id => vc.setPointerCapture(id)); } catch(err){}
    }
  });
  vc.addEventListener('pointermove', e => {
    if (!pinch.has(e.pointerId)) return;
    pinch.set(e.pointerId, e.clientX);
    if (pinch.size !== 2 || !pz) return;
    const xs = [...pinch.values()], d = Math.abs(xs[0] - xs[1]) || 1;
    let span = Math.round(pz.span * pz.d / d);
    span = Math.max(7, Math.min(pz.total, span));
    const next = span >= pz.total ? null : span;
    if (next !== S.chg.span) { S.chg.span = next; cancelAnimationFrame(pzRaf); pzRaf = requestAnimationFrame(drawChg); }
  });
  const pend = e => { pinch.delete(e.pointerId); if (pinch.size < 2) pz = null; };
  vc.addEventListener('pointerup', pend); vc.addEventListener('pointercancel', pend);
  vc.addEventListener('gesturestart', e => e.preventDefault());   // 아이폰 Safari 화면 확대 막기
  vc.addEventListener('pointerdown', chgScrub);
  $('#view-chg').addEventListener('pointermove', e => { if (!pz && (e.buttons || e.pointerType === 'touch')) chgScrub(e); });

  $('#view-set').addEventListener('click', async e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const st = S.settings;
    try {
      switch (el.dataset.act) {
        case 'tag': openTagSheet(st.tags.find(t => t.id === el.dataset.id)); break;
        case 'tag-new': openTagSheet(); break;
        case 'inbody': { const fi = $('#inbodyInput'); fi.value = ''; fi.click(); break; }
        case 'bulk': {
          if (el.disabled) break; el.disabled = true; el.textContent = '반영하는 중…';
          try {
            const r = await call('importSheet', {});
            if (r.error) toast(r.error);
            else if (r.created) toast("시트에 '일괄입력' 탭을 만들었어요. 채운 뒤 다시 눌러 주세요");
            else if (r.empty || (!r.rows && !r.workouts)) toast('새로 반영할 줄이 없어요');
            else { clearDataCaches(); toast(`${r.rows}줄 반영 (신체 ${r.body}일 · 상태 ${r.states}일 · 운동 ${r.workouts}개 · 걸음 ${r.steps || 0}일)${r.bad.length ? ` · 날짜 오류 ${r.bad.length}줄` : ''}`); }
          } catch(err){ fail(err); }
          finally { el.disabled = false; el.textContent = '일괄입력 탭 반영하기'; }
          break;
        }
        case 'back': setTab('today'); break;
        case 'connect': openConnectSheet(); break;
        case 'chip': openChipSheet(+el.dataset.i); break;
        case 'chip-new': openChipSheet(-1); break;
        case 'ws': st.weekStart = el.dataset.v; await saveSettings(); break;
        case 'school-search': {
          S.schoolQ = $('#schoolQ').value.trim(); if (!S.schoolQ) break;
          el.disabled = true; el.textContent = '검색 중…';
          try { S.schoolResults = await call('searchSchool', { name: S.schoolQ }); if (!S.schoolResults.length) toast('검색 결과가 없어요'); }
          finally { renderSet(); }
          break;
        }
        case 'school-pick': {
          const r = S.schoolResults[+el.dataset.i]; if (!r) break;
          st.school = { name: r.name, officeCode: r.officeCode, code: r.code };
          S.schoolResults = []; S.schoolQ = '';
          await saveSettings(); toast(r.name + '(으)로 설정했어요'); break;
        }
      }
    } catch(err){ fail(err); }
  });
  $('#view-set').addEventListener('change', e => {
    if (e.target.id === 'scName') { S.settings.shortcutName = e.target.value.trim() || DEFAULT_SC; saveSettings().catch(fail); }
  });

  $('#sheetCancel').onclick = closeSheet;
  $('#backdrop').onclick = closeSheet;
  $('#sheetSave').onclick = sheetSave;

  $('#photoInput').onchange = onPicked;

  $('#exClose').onclick = () => $('#ex').classList.add('hidden');
  $('#exShare').onclick = shareExport;
  document.querySelector('.ex-mode').onclick = e => { const b = e.target.closest('[data-mode]'); if (b && b.dataset.mode !== S.exMode) setExMode(b.dataset.mode); };
  $('#exDayNav').onclick = e => { const b = e.target.closest('[data-dd]'); if (b) exGoDay(+b.dataset.dd); };
  $('#exWeekNav').onclick = e => { const b = e.target.closest('[data-wk]'); if (!b) return; S.exWeek = addDays(S.exWeek, 7 * +b.dataset.wk); drawWeek(); };
  $('#exOpts').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k; if (k === 'all') EX_ITEMS.forEach(([x]) => S.exOpt[x] = true); else S.exOpt[k] = !S.exOpt[k]; paintExOpts(); drawExport(); };

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') {
    checkUpdate();
    if (DEMO) return;
    if (qLoad().length) flush();   // 보내고 나면 알아서 다시 받아와요
    else if (S.tab === 'today' && !sheetCtx) loadDay();   // 인바디·단축어에서 돌아오면 최신 기록으로
  } });
  window.addEventListener('online', () => { if (!DEMO && qLoad().length) flush(); });
  setInterval(() => { if (!DEMO && qLoad().length && navigator.onLine !== false) flush(); }, 60000);   // 못 보낸 게 있으면 1분마다 다시
  $('#saving').onclick = () => {
    if (flushing || !qLoad().length) return;
    const err = qLoad().map(x => x.lastErr).filter(Boolean)[0];
    toast(err ? '다시 보내는 중이에요 (지난 오류: ' + err + ')' : '다시 보내는 중이에요');
    flush();
  };
  qBadge();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.settings && S.tab === 'today' && !sheetCtx) loadDay();
  });
}

boot();
</script>
</body>
</html>
